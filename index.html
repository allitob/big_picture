<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Big Picture</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Big Picture" />
<meta name="theme-color" content="#185fa5" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png" />
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f4f0;
    --text: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #e2e0d8;
    --warning-bg: #faeeda;
    --warning-text: #854f0b;
    --danger-text: #a32d2d;
    --accent: #185fa5;
    --accent-soft: #dde9f5;
    --done-text: #2f6b2a;
    --done-bg: #e3efdf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --surface: #2c2c2a;
      --text: #f1efe8;
      --text-secondary: #b4b2a9;
      --text-muted: #888780;
      --border: #444441;
      --warning-bg: #412402;
      --warning-text: #fac775;
      --danger-text: #f09595;
      --accent: #85b7eb;
      --accent-soft: #23384d;
      --done-text: #a8d69f;
      --done-bg: #24361f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 1.5rem; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .section { margin-bottom: 2rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 0.75rem; }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button:active { opacity: 0.7; }
  button.small { font-size: 13px; padding: 5px 10px; }
  input, textarea, select {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    margin-bottom: 8px;
  }
  textarea { min-height: 70px; resize: none; overflow: hidden; }
  .card {
    background: var(--surface);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    margin-bottom: 8px;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card p { margin: 0; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
  .link-btn { font-size: 12px; color: var(--accent); text-decoration: none; cursor: pointer; background: none; border: none; padding: 0; }
  .link-btn.danger { color: var(--danger-text); }
  .history-panel { margin-top: 6px; padding: 4px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); }
  .history-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); padding: 4px 0; cursor: pointer; }
  .history-content { padding: 0 0 8px; border-top: 1px dashed var(--border); margin-top: -2px; }
  .history-content p { margin: 6px 0 0 !important; }
  .stale-flag { display: inline-block; font-size: 11px; color: var(--warning-text); background: var(--warning-bg); padding: 2px 6px; border-radius: 6px; margin-top: 4px; }
  .bet-name { font-weight: 600; font-size: 15px; margin-bottom: 2px !important; }
  .bet-why { font-size: 13px; color: var(--text-secondary); white-space: pre-wrap; }
  .badge { font-size: 12px; white-space: nowrap; color: var(--text-muted); }
  .muted { color: var(--text-muted); font-size: 14px; }
  .small-muted { color: var(--text-muted); font-size: 12px; }
  .log-entry { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 8px; }
  .log-date { font-size: 12px; color: var(--text-muted); margin: 0 0 2px !important; }
  .log-text { font-size: 14px; white-space: pre-wrap; margin: 0; }
  .form-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1.5rem;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .nudge {
    background: var(--warning-bg);
    color: var(--warning-text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 1.5rem;
    display: none;
  }
  .divider { border-top: 1px solid var(--border); padding-top: 1.5rem; }
  .status { font-size: 13px; color: var(--text-muted); text-align: center; padding: 2rem 0; }

  /* v2: lifecycle */
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; vertical-align: 1px; margin-left: 6px; }
  .pill.done { color: var(--done-text); background: var(--done-bg); }
  .pill.dropped { color: var(--text-secondary); background: var(--border); }
  .closed-card { background: transparent; border: 1px solid var(--border); }
  .outcome { font-size: 13px; white-space: pre-wrap; margin-top: 4px !important; }
  .outcome-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-top: 8px !important; }
  .close-form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .seg button { border: none; border-radius: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: var(--bg); }
  .toggle-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }

  /* v2: review */
  .review-card { background: var(--surface); border-radius: 12px; padding: 1rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .stat .n { font-size: 20px; font-weight: 600; line-height: 1.2; }
  .stat .l { font-size: 11px; color: var(--text-muted); }
  .dots { display: flex; gap: 4px; margin-top: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .dot.on { background: var(--accent); }
  .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 8px; align-items: center; margin-bottom: 6px; }
  .bar-label { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 6px; border-radius: 3px; background: var(--bg); margin-top: 2px; }
  .bar-fill { height: 6px; border-radius: 3px; background: var(--accent); }
  .bar-n { font-size: 12px; color: var(--text-muted); text-align: right; }
  .untouched { font-size: 13px; color: var(--warning-text); margin-top: 8px !important; }

  /* v2: log */
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .filters select, .filters input { margin-bottom: 0; font-size: 14px; padding: 8px 10px; }
  .week-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .week-head:first-child { margin-top: 12px; }
  .copied { font-size: 12px; color: var(--done-text); margin-left: 8px; }

  /* v2.1: header, bet chips, attachments */
  .title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 1.5rem; }
  .title-row h1 { margin: 0; }
  .version { font-size: 12px; color: var(--text-muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
  .chip-hint { font-size: 12px; color: var(--text-muted); align-self: center; }
  .composer.ai textarea { border-color: var(--ai); box-shadow: inset 3px 0 0 var(--ai); }
  .composer.dragging textarea { border-color: var(--accent); border-style: dashed; }
  .att-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .att { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); cursor: pointer; padding: 0; flex: none; }
  .att img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.65); color: #fff; font-size: 13px; line-height: 20px; text-align: center; }
  .att .ph { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); }
  .compose-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* v2.2: calendar, day card, toast */
  :root { --heat-0: #ebe9e2; --heat-1: #9be9a8; --heat-2: #40c463; --heat-3: #30a14e; --heat-4: #216e39; }
  @media (prefers-color-scheme: dark) {
    :root { --heat-0: #333331; --heat-1: #0e4429; --heat-2: #006d32; --heat-3: #26a641; --heat-4: #39d353; }
  }
  .heat { display: flex; gap: 6px; margin-top: 12px; }
  .heat-days { display: grid; grid-template-rows: 14px repeat(7, 13px); row-gap: 3px; font-size: 10px; color: var(--text-muted); flex: none; }
  .heat-days span { line-height: 13px; }
  .heat-scroll { overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: thin; }
  .heat-inner { position: relative; display: inline-block; padding-top: 17px; padding-right: 14px; }
  .heat-months { position: absolute; top: 0; left: 0; height: 14px; font-size: 10px; color: var(--text-muted); white-space: nowrap; }
  .heat-months span { position: absolute; }
  .heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); grid-auto-columns: 13px; gap: 3px; }
  .cell { width: 13px; height: 13px; border-radius: 3px; background: var(--heat-0); border: none; padding: 0; }
  .cell.l1 { background: var(--heat-1); } .cell.l2 { background: var(--heat-2); }
  .cell.l3 { background: var(--heat-3); } .cell.l4 { background: var(--heat-4); }
  .cell.has { cursor: pointer; }
  .cell.future { background: transparent; }
  .cell.today { outline: 1.5px solid var(--text-secondary); outline-offset: 1px; }
  .cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cell.dim { opacity: 0.2; }
  .heat-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
  .legend { display: flex; align-items: center; gap: 3px; }
  .legend .cell { width: 10px; height: 10px; border-radius: 2px; }
  .log-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .log-head .seg { margin-bottom: 0; }
  .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 82vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; box-shadow: 0 -4px 24px rgba(0,0,0,0.2); }
  @media (min-width: 640px) { .sheet-back { align-items: center; } .sheet { border-radius: 16px; max-height: 80vh; } }
  .sheet-head { display: flex; align-items: center; gap: 6px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--border); }
  .sheet-title { flex: 1; min-width: 0; }
  .sheet-title strong { display: block; font-size: 15px; }
  .sheet-title span { font-size: 12px; color: var(--text-muted); }
  .icon-btn { width: 34px; height: 34px; padding: 0; font-size: 16px; line-height: 1; flex: none; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .sheet-body { overflow-y: auto; padding: 12px 16px 24px; -webkit-overflow-scrolling: touch; }
  .sheet-body .log-entry:last-child { border-bottom: none; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; display: flex; gap: 14px; align-items: center; z-index: 60; box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  .toast a { color: var(--accent-soft); font-weight: 600; cursor: pointer; }
  /* v2.3: quarters, kebab menu, AI summaries */
  :root { --ai: #7a4fd6; --ai-bg: #f1ecfb; }
  @media (prefers-color-scheme: dark) { :root { --ai: #b9a0f5; --ai-bg: #2a2340; } }
  .heat-quarters { position: relative; height: 18px; margin-top: 6px; font-size: 10px; color: var(--text-muted); }
  .heat-quarters span { position: absolute; top: 0; border-top: 1px solid var(--border); padding-top: 2px; white-space: nowrap; overflow: hidden; }
  .heat-days { grid-template-rows: 14px repeat(7, 13px) 24px; }
  .card-actions { align-items: center; }
  .kebab-wrap { position: relative; margin-left: auto; }
  .kebab { background: none; border: none; padding: 0 6px; font-size: 18px; line-height: 1; color: var(--text-muted); cursor: pointer; border-radius: 6px; }
  .kebab:hover, .kebab[aria-expanded="true"] { background: var(--surface); color: var(--text); }
  .menu { position: absolute; right: 0; top: calc(100% + 4px); min-width: 140px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); padding: 4px; z-index: 30; }
  .menu button { display: block; width: 100%; white-space: nowrap; text-align: left; border: none; background: none; padding: 8px 10px; font-size: 14px; border-radius: 6px; }
  .menu button:hover { background: var(--surface); }
  .menu button.danger { color: var(--danger-text); }
  .log-entry.ai { border-left: 3px solid var(--ai); background: var(--ai-bg); border-radius: 0 8px 8px 0; padding: 8px 10px; border-bottom-color: transparent; }
  .ai-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--ai); margin-left: 6px; vertical-align: 1px; }
  .ai-badge svg, .ai-toggle svg { width: 12px; height: 12px; fill: currentColor; }
  .ai-toggle { display: inline-flex; align-items: center; gap: 5px; color: var(--text-secondary); }
  .ai-toggle[aria-pressed="true"] { background: var(--ai-bg); border-color: var(--ai); color: var(--ai); font-weight: 600; }
  /* v2.4: layout — writing first, folding side sections, settings menu */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 1.25rem; }
  .top .title-row { margin-bottom: 0; }
  .gear { font-size: 17px; padding: 4px 8px; }
  .layout { display: block; }
  .col-side .fold { border-top: 1px solid var(--border); }
  .fold-head { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; border-radius: 0; padding: 14px 0; text-align: left; cursor: pointer; }
  .fold-head h2 { flex: none; }
  .fold-sum { flex: 1; min-width: 0; font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fold-sum .warn { color: var(--warning-text); }
  .fold-chev { flex: none; color: var(--text-muted); transition: transform 0.15s; font-size: 14px; }
  .fold:not(.collapsed) .fold-chev { transform: rotate(90deg); }
  .fold-body { padding-bottom: 1.5rem; }
  .fold.collapsed .fold-body { display: none; }
  .fold-tools { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 10px; }
  @media (min-width: 900px) {
    .wrap { max-width: 1120px; padding: 2rem 1.5rem 4rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: start; }
    .col-side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 4px; }
    .col-side .fold:first-child { border-top: none; }
    .fold-head { padding-top: 0; }
    .col-side .fold + .fold .fold-head { padding-top: 14px; }
  }
  /* v2.5: future bets, importer */
  .pill.idea { color: var(--accent); background: var(--accent-soft); }
  .future-card { background: transparent; border: 1px dashed var(--border); }
  .imp-sec { margin: 4px 0 16px; }
  .imp-sec-head { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 6px; }
  .imp-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; }
  .imp-row input { width: auto; margin: 2px 0 0; flex: none; }
  .imp-row .what { color: var(--text-muted); font-size: 12px; }
  .imp-row .change { color: var(--accent); }
  .imp-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--border); }
  /* v2.6: compact bets, fewer chips */
  .bet-card { padding: 0; margin-bottom: 6px; }
  .bet-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; }
  .bet-row .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .bet-row .age { flex: none; font-size: 12px; font-variant-numeric: tabular-nums; }
  .bet-detail { padding: 0 12px 10px; }
  .bet-detail .card-actions { margin-top: 8px; }
  .chip.more { border-style: dashed; color: var(--text-muted); }
  .chip { max-width: 280px; }
  /* v2.7: review "Other" tooltip, composer hint, Haiku tagging */
  .bar-row.other { position: relative; cursor: default; }
  .bar-row.other .bar-label { color: var(--text-secondary); }
  .tip { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--text); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
  .bar-row.other:hover .tip, .bar-row.other:focus-within .tip, .bar-row.other.open .tip { display: block; }
  .compose-hint { font-size: 12px; color: var(--text-muted); margin: -2px 0 8px; min-height: 16px; }
  .compose-hint kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--text-secondary); }
  .compose-hint .ai-note { color: var(--ai); }
  .ai-suggest { color: var(--ai); }
  .compose-hint .err { color: var(--danger-text); }
  /* v3.0: summaries / story */
  .sum-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--accent-soft); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 1.5rem; }
  .sum-banner .grow { flex: 1; min-width: 180px; }
  .sum-banner .small-muted { display: block; }
  .story-text { font-size: 13px; line-height: 1.5; margin: 0; }
  .story-text h4 { font-size: 14px; margin: 0 0 4px; }
  .story-text h5 { font-size: 13px; margin: 10px 0 2px; color: var(--text-secondary); }
  .story-text ul { margin: 2px 0 0; padding-left: 18px; }
  .story-text p { margin: 4px 0; }
  .story-card { background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .story-card.header { border-left: 3px solid var(--ai); }
  .story-row { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--surface); border: none; border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; text-align: left; cursor: pointer; font-size: 14px; }
  .story-row .nm { flex: 1; font-weight: 600; }
  .story-row .meta { font-size: 12px; color: var(--text-muted); }
  .story-open { background: var(--surface); border-radius: 0 0 10px 10px; padding: 0 12px 10px; margin: -8px 0 8px; }
  .draft-ta { font-size: 14px; line-height: 1.55; min-height: 240px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-row"><h1>Big picture</h1><span id="version" class="version"></span></div>
    <span id="settings-slot"></span>
  </header>
  <div id="status" class="status">Connecting…</div>

  <form id="setup" class="form-card" style="display:none;" autocomplete="on">
    <p class="muted" style="margin-top:0;">Enter your sync ID to connect this device to your data. (Find it in your other device's settings, or pick a new private string if this is your first device.) Your browser can offer to save this like a password.</p>
    <input id="setup-label" name="username" value="big-picture" autocomplete="username" style="position:absolute; left:-9999px;" tabindex="-1" aria-hidden="true" />
    <input id="setup-doc-id" name="password" type="password" placeholder="Sync ID" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" />

  <div id="app" style="display:none;">

                <button id="save-bet-btn">Save bet</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ---- PASTE YOUR FIREBASE CONFIG HERE ----
  const firebaseConfig = {
    apiKey: "AIzaSyB_4N7Z2a_qQwaL-aY-47WDAXZeqS8fRUI",
    authDomain: "big-picture-8bd64.firebaseapp.com",
    projectId: "big-picture-8bd64",
    storageBucket: "big-picture-8bd64.firebasestorage.app",
    messagingSenderId: "286061786704",
    appId: "1:286061786704:web:d0b8196cbb701c32920355"
  };
  // ------------------------------------------

  // Bump APP_VERSION and APP_UPDATED when shipping a change. The date is
  // refreshed from GitHub's last commit to index.html when reachable.
  const APP_VERSION = '3.2';
  const APP_UPDATED = '2026-11-07';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Data model (all v2 fields optional, so v1 documents load unchanged):
  //   bet:   { id, name, why, created, history[{v,date,name,why}],
  //            status: 'active'|'done'|'dropped', closed, outcome,
  //            statusLog[{date, status, outcome}] }
  //   entry.ai: true when the note is an AI summary (badge + violet styling)
  //   entry: { id, text, betIds[], betId (= betIds[0], for v1 readers), date,
  //            history[{v,date,text}], deleted, attachments[{id, w, h}] }
  //   images: separate docs bigpicture/<syncId>__img_<id> and __thm_<id>
  //           ({ data: dataURL, w, h, created }) so the main doc stays far below
  //           Firestore's 1 MB limit. Same collection, so the existing rules apply.
  let data = { bets: [], log: [] };
  let docRef = null;
  let syncId = null;
  let authReady = false;

  // UI state
  let editingBetId = null;
  let closingBetId = null;
  let closingStatus = 'done';
  let expandedBetHistory = null;
  let editingLogId = null;
  let expandedLogHistory = null;
  let expandedVersionKey = null;
  let expandedTexts = new Set();
  let showClosed = false;
  let showFuture = false;
  let expandedBetId = null;
  let chipsOpen = false;
  let reviewRange = 'week';
  let logLimit = 20;
  let filterBet = 'all';
  let filterText = '';
  let logView = 'calendar';     // 'calendar' | 'list'; a search always shows matching notes as a list
  let openDay = null;           // 'YYYY-MM-DD' of the day card, or null
  let heatScrolledToEnd = false;
  let showDeleted = false;

  const WHY_LIMIT = 160;
  const LOG_LIMIT = 240;
  const LOG_PAGE = 20;
  const RANGES = [
    { key: 'week', label: 'This week' },
    { key: 'last', label: 'Last week' },
    { key: '4w', label: '4 weeks' },
    { key: 'all', label: 'All' },
  ];

  const statusEl = document.getElementById('status');
  const appEl = document.getElementById('app');
  const setupEl = document.getElementById('setup');
  const setupInput = document.getElementById('setup-doc-id');

  // The sync ID is never stored in source (this repo is public) — each device
  // stores its own copy in localStorage after you enter it once. It's just a
  // private string that names your document in Firestore; Firestore rules only
  // require an authenticated (anonymous) session, so keeping this ID out of the
  // public repo is what actually keeps your data private.
  const DOC_ID_KEY = 'bp-doc-id';

  onAuthStateChanged(auth, (user) => {
    if (!user) return;
    authReady = true;
    tryConnect();
  });

  signInAnonymously(auth).catch((err) => {
    statusEl.textContent = "Couldn't connect: " + err.message;
  });

  function tryConnect() {
    if (!authReady) return;
    const savedId = localStorage.getItem(DOC_ID_KEY);
    if (!savedId) {
      statusEl.style.display = 'none';
      setupEl.style.display = 'block';
      setupInput.focus();
      return;
    }
    setupEl.style.display = 'none';
    connect(savedId);
  }

  async function connect(docId) {
    syncId = docId;
    docRef = doc(db, "bigpicture", docId);
    statusEl.style.display = 'block';
    statusEl.textContent = 'Connecting…';
    appEl.style.display = 'none';
    try {
      await load();
    } catch (e) {
      statusEl.innerHTML = '';
      statusEl.appendChild(el('p', '', 'Couldn\'t load your data (' + (e.code || e.message || 'error') + '). Nothing was changed.'));
      const retry = el('button', '', 'Try again');
      retry.addEventListener('click', () => connect(docId));
      const change = el('button', '', 'Change sync ID');
      change.style.marginLeft = '8px';
      change.addEventListener('click', () => document.getElementById('change-sync-id').click());
      statusEl.appendChild(retry);
      statusEl.appendChild(change);
      return;
    }
    statusEl.style.display = 'none';
    appEl.style.display = 'block';
    render();   // again now that widths are known (calendar fits its column)
    // Desktop: cursor straight into the writing box. Not on touch screens, where it would pop the keyboard.
    if (window.matchMedia('(min-width: 900px) and (pointer: fine)').matches) {
      requestAnimationFrame(() => document.getElementById('log-text').focus());
    }
  }

  document.getElementById('setup-show').addEventListener('change', (e) => {
    setupInput.type = e.target.checked ? 'text' : 'password';
  });

  setupEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = setupInput.value.trim();
    if (!id) return;
    localStorage.setItem(DOC_ID_KEY, id);
    setupEl.style.display = 'none';
    connect(id);
  });

  document.getElementById('change-sync-id').addEventListener('click', (e) => {
    e.preventDefault();
    appEl.style.display = 'none';
    statusEl.style.display = 'none';
    setupInput.value = localStorage.getItem(DOC_ID_KEY) || '';
    setupEl.style.display = 'block';
    setupInput.focus();
  });

  // ---------- dates ----------
  function fmtDate(d) {
    return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function fmtDay(d) {
    return new Date(d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function daysSince(d) {
    return Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
  }
  // Monday 00:00 local of the week containing d.
  function weekStart(d) {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function addDays(d, n) {
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }
  function isoWeek(d) {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() + 3 - ((x.getDay() + 6) % 7));
    const jan4 = new Date(x.getFullYear(), 0, 4);
    return 1 + Math.round(((x - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  }
  function weekLabel(start) {
    const end = addDays(start, 6);
    return 'Week ' + isoWeek(start) + ' · ' + fmtDate(start) + '–' + fmtDate(end);
  }
  function weeksBetween(a, b) {
    return Math.max(1, Math.round((new Date(b) - new Date(a)) / (7 * 86400000)));
  }

  // ---------- model helpers ----------
  // Lazily synthesizes a v1 history entry for items saved before versioning existed.
  function ensureHistory(item, fields) {
    if (!item.history || !item.history.length) {
      const first = { v: 1, date: item.created || item.date || new Date().toISOString() };
      fields.forEach(f => { first[f] = item[f]; });
      item.history = [first];
    }
    return item.history;
  }
  function betStatus(bet) { return bet.status || 'active'; }
  function isActive(bet) { return betStatus(bet) === 'active'; }
  function isClosed(bet) { const s = betStatus(bet); return s === 'done' || s === 'dropped'; }
  const STATUS_LABEL = { done: 'Done', dropped: 'Dropped', idea: 'Future', active: 'Active' };
  function statusPill(bet) { return el('span', 'pill ' + betStatus(bet), STATUS_LABEL[betStatus(bet)] || betStatus(bet)); }
  function liveLog() { return data.log.filter(l => !l.deleted); }
  function entryBetIds(e) { return e.betIds || (e.betId ? [e.betId] : []); }
  function entryBets(e) { return entryBetIds(e).map(id => data.bets.find(b => b.id === id)).filter(Boolean); }
  function setEntryBets(e, ids) { e.betIds = ids; e.betId = ids[0] || null; }
  function entriesFor(betId) { return liveLog().filter(l => entryBetIds(l).includes(betId)); }

  // Which version of a bet was current as of a given date (used to flag log
  // entries logged against a bet that has since been edited).
  function betVersionAtDate(bet, dateStr) {
    const t = new Date(dateStr).getTime();
    let v = bet.history[0].v;
    bet.history.forEach(h => {
      if (new Date(h.date).getTime() <= t) v = h.v;
    });
    return v;
  }

  function lastTouch(betId) {
    const entries = entriesFor(betId);
    if (!entries.length) return null;
    return entries.reduce((a, b) => new Date(a.date) > new Date(b.date) ? a : b).date;
  }

  function rangeBounds(key) {
    const ws = weekStart(new Date());
    if (key === 'week') return { from: ws, to: addDays(ws, 7), label: weekLabel(ws) };
    if (key === 'last') { const s = addDays(ws, -7); return { from: s, to: ws, label: weekLabel(s) }; }
    if (key === '4w') { const s = addDays(ws, -21); return { from: s, to: addDays(ws, 7), label: fmtDate(s) + '–' + fmtDate(addDays(ws, 6)) }; }
    return { from: new Date(0), to: new Date(8.64e15), label: 'All time' };
  }
  function inRange(dateStr, r) {
    const t = new Date(dateStr);
    return t >= r.from && t < r.to;
  }

  // ---------- shared renderers ----------
  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function linkBtn(text, onClick, extraClass) {
    const a = el('a', 'link-btn' + (extraClass ? ' ' + extraClass : ''), text);
    a.href = '#';
    a.addEventListener('click', (e) => { e.preventDefault(); onClick(); });
    return a;
  }

  // Renders text with a "Show more…" / "Show less" toggle when it exceeds
  // `limit`. `key` must be unique among everything sharing expandedTexts.
  function appendExpandableText(container, key, fullText, limit, className) {
    const p = el('p', className);
    const isLong = fullText.length > limit;
    const isExpanded = expandedTexts.has(key);
    if (isLong && !isExpanded) {
      p.textContent = fullText.slice(0, limit).trimEnd() + '… ';
      p.appendChild(linkBtn('Show more…', () => { expandedTexts.add(key); render(); }));
    } else {
      p.textContent = fullText;
      if (isLong) {
        p.appendChild(document.createTextNode(' '));
        p.appendChild(linkBtn('Show less', () => { expandedTexts.delete(key); render(); }));
      }
    }
    container.appendChild(p);
  }

  function appendHistoryPanel(container, history, keyPrefix, renderContent) {
    const panel = el('div', 'history-panel');
    [...history].reverse().forEach(h => {
      const key = keyPrefix + '-v' + h.v;
      const rowWrap = el('div');
      const row = el('div', 'history-row');
      row.appendChild(el('span', '', 'v' + h.v));
      row.appendChild(el('span', '', fmtDate(h.date)));
      row.addEventListener('click', () => {
        expandedVersionKey = expandedVersionKey === key ? null : key;
        render();
      });
      rowWrap.appendChild(row);
      if (expandedVersionKey === key) {
        const content = el('div', 'history-content');
        renderContent(content, h);
        rowWrap.appendChild(content);
      }
      panel.appendChild(rowWrap);
    });
    container.appendChild(panel);
  }

  function betHistoryPanel(wrapper, bet) {
    appendHistoryPanel(wrapper, bet.history, 'bet-' + bet.id, (content, h) => {
      const nameP = el('p', 'bet-name', h.name);
      nameP.style.fontSize = '13px';
      content.appendChild(nameP);
      appendExpandableText(content, 'histv-bet-' + bet.id + '-v' + h.v, h.why || '', WHY_LIMIT, 'bet-why');
    });
  }

  // ---------- persistence ----------
  // 'ok' = document loaded, 'empty' = no document under this sync ID yet,
  // 'failed' = couldn't read it. Saving is blocked unless the load succeeded, so a
  // failed or wrong-ID load can never overwrite real data with an empty page.
  let loadState = 'pending';
  async function load() {
    try {
      const snap = await getDoc(docRef);
      if (snap.exists()) { data = snap.data(); loadState = 'ok'; }
      else { data = { bets: [], log: [] }; loadState = 'empty'; }
    } catch (e) {
      console.error('load failed', e);
      loadState = 'failed';
      throw e;
    }
    data.bets = data.bets || [];
    data.log = data.log || [];
    render();
  }

  async function save() {
    if (loadState !== 'ok' && loadState !== 'empty') {
      alert('Not saved: your data never loaded on this device, so saving could overwrite it. Reload the app and try again.');
      return;
    }
    try {
      await setDoc(docRef, data);
    } catch (e) {
      console.error('save failed', e);
      alert('Save failed: ' + e.message);
    }
  }

  // ---------- render ----------
  function render() {
    renderNudge();
    renderSummaryBanner();
    renderStory();
    renderFoldSummaries();
    renderBets();
    renderFutureBets();
    renderClosedBets();
    renderLogSelect();
    renderReview();
    renderLog();
    renderDaySheet();
    requestAnimationFrame(() => document.querySelectorAll('#app textarea').forEach(autosize));
  }

  function renderNudge() {
    const nudge = document.getElementById('nudge');
    if (loadState === 'empty' && !data.bets.length && !data.log.length) {
      nudge.style.display = 'block';
      nudge.textContent = 'No data found for this sync ID. If you already have notes on another device, check ⚙ → Change sync ID before adding anything here.';
      return;
    }
    const log = liveLog();
    if (!log.length) { nudge.style.display = 'none'; return; }
    const lastEntry = [...log].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
    // Same rule as the email nudge: weekends don't count, and no banner on weekends.
    const now = new Date();
    const weekend = d => d.getDay() === 0 || d.getDay() === 6;
    let ds = 0;
    for (let d = addDays(new Date(lastEntry.date).setHours(0, 0, 0, 0), 1); d <= now; d = addDays(d, 1)) if (!weekend(d)) ds++;
    if (ds >= 2 && !weekend(now)) {
      nudge.style.display = 'block';
      nudge.textContent = ds + ' workdays since your last log entry. Quick check-in?';
    } else {
      nudge.style.display = 'none';
    }
  }

  // ---------- folding side sections + settings ----------
  // Bets and Review fold to a one-line summary on narrow screens (remembered per
  // device); on wide screens they sit open in the sticky sidebar.
  const FOLD_KEY = id => 'bp-fold-' + id;
  function foldState(id) { try { return localStorage.getItem(FOLD_KEY(id)); } catch (e) { return null; } }
  document.querySelectorAll('.fold').forEach(sec => {
    const id = sec.id.replace('fold-', '');
    const head = sec.querySelector('.fold-head');
    const apply = (collapsed) => {
      sec.classList.toggle('collapsed', collapsed);
      head.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    };
    // Remembered per device. Defaults: Bets folded everywhere; Review open on wide screens.
    const saved = foldState(id);
    const wide = window.matchMedia('(min-width: 900px)').matches;
    apply(saved ? saved !== 'open' : !(id === 'review' && wide));
    head.addEventListener('click', () => {
      const collapsed = !sec.classList.contains('collapsed');
      apply(collapsed);
      try { localStorage.setItem(FOLD_KEY(id), collapsed ? 'closed' : 'open'); } catch (e) {}
      if (!collapsed) requestAnimationFrame(() => sec.querySelectorAll('textarea').forEach(autosize));
    });
  });
  function openFold(id) {
    const sec = document.getElementById('fold-' + id);
    if (sec && sec.classList.contains('collapsed')) sec.querySelector('.fold-head').click();
  }

  function quietBets() {
    return data.bets.filter(b => {
      if (!isActive(b)) return false;
      const lt = lastTouch(b.id);
      return daysSince(lt || b.created || b.history[0].date) >= 7;
    });
  }
  function renderFoldSummaries() {
    const active = data.bets.filter(isActive);
    const bs = document.getElementById('bets-sum');
    bs.innerHTML = '';
    bs.appendChild(document.createTextNode(active.length ? active.length + ' active' : 'none active'));
    const quiet = quietBets();
    if (quiet.length) {
      bs.appendChild(document.createTextNode(' · '));
      bs.appendChild(el('span', 'warn', quiet.length + ' quiet 7+ days'));
    }
    const r = rangeBounds('week');
    const wk = liveLog().filter(l => inRange(l.date, r));
    const days = new Set(wk.map(e => new Date(e.date).toDateString()));
    document.getElementById('review-sum').textContent =
      'This week · ' + plural(wk.length, 'note', 'notes') + ' · ' + countWorkdays(days, r.from) + '/5 days';
  }

  // ---------- plan import ----------
  // A plan file (format "big-picture-plan/1") creates or updates bets and re-assigns
  // notes to bets. Nothing is applied until reviewed: every change has a checkbox.
  // Applying first downloads a full backup and offers Undo.
  //   { format, title, bets: [{ key, existing?, name, why, status, closed?, outcome? }],
  //     assign: [{ id: <log entry id>, bets: [<bet key or existing bet id>] }] }
  const importInput = el('input');
  importInput.type = 'file';
  importInput.accept = '.json,application/json';
  importInput.hidden = true;
  document.body.appendChild(importInput);
  importInput.addEventListener('change', async () => {
    const f = importInput.files[0];
    importInput.value = '';
    if (!f) return;
    let plan;
    try { plan = JSON.parse(await f.text()); } catch (e) { alert('That file isn\'t valid JSON.'); return; }
    if (!plan || !String(plan.format || '').startsWith('big-picture-plan/') || !Array.isArray(plan.bets)) {
      alert('That file isn\'t a Big Picture plan.');
      return;
    }
    openImportSheet(plan);
  });

  function planDate(d) {
    if (!d) return null;
    return /^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d + 'T12:00:00').toISOString() : new Date(d).toISOString();
  }

  function buildImport(plan) {
    const byName = new Map(data.bets.map(b => [b.name.trim().toLowerCase(), b]));
    const keyToId = new Map();
    const betOps = plan.bets.map((pb, i) => {
      let target = data.bets.find(b => b.id === pb.key) || byName.get(String(pb.name || '').trim().toLowerCase());
      const status = ['active', 'idea', 'done', 'dropped'].includes(pb.status) ? pb.status : 'active';
      if (target) {
        keyToId.set(pb.key, target.id);
        const changes = [];
        if (pb.name && pb.name !== target.name) changes.push('renamed from "' + target.name + '"');
        if (pb.why !== undefined && pb.why !== (target.why || '')) changes.push('why rewritten');
        if (status !== betStatus(target)) changes.push(STATUS_LABEL[betStatus(target)] + ' → ' + STATUS_LABEL[status]);
        return { kind: 'update', pb, status, target, changes, on: changes.length > 0 };
      }
      const id = 'bet_' + (Date.now() + i);
      keyToId.set(pb.key, id);
      return { kind: 'create', pb, status, id, on: true };
    });
    const noteOps = [];
    let missing = 0;
    (plan.assign || []).forEach(a => {
      const entry = data.log.find(e => e.id === a.id && !e.deleted);
      if (!entry) { missing++; return; }
      const ids = (a.bets || []).map(k => keyToId.get(k) || (data.bets.some(b => b.id === k) ? k : null)).filter(Boolean);
      const cur = entryBetIds(entry);
      if (ids.length === cur.length && ids.every(x => cur.includes(x))) return;
      noteOps.push({ entry, ids, on: true });
    });
    return { betOps, noteOps, missing, keyToId };
  }

  function applyImport(imp) {
    const now = new Date().toISOString();
    const stats = { created: 0, updated: 0, notes: 0 };
    const enabledBetIds = new Set();
    imp.betOps.forEach(o => {
      if (o.kind === 'update' && !o.on) enabledBetIds.add(o.target.id);   // existing bet, just untouched
      if (!o.on) return;
      const pb = o.pb;
      if (o.kind === 'create') {
        // Start date = first note assigned to this bet, so "ran N wk" is meaningful.
        const noteDates = imp.noteOps.filter(n => n.on && n.ids.includes(o.id)).map(n => n.entry.date).sort();
        const closed = planDate(pb.closed);
        const created = noteDates[0] || closed || now;
        const bet = { id: o.id, name: pb.name, why: pb.why || '', created, status: o.status,
          history: [{ v: 1, date: created, name: pb.name, why: pb.why || '' }], statusLog: [] };
        if (o.status === 'idea') bet.statusLog.push({ date: created, status: 'idea', outcome: '' });
        if (o.status === 'done' || o.status === 'dropped') {
          bet.closed = closed || now;
          bet.outcome = pb.outcome || '';
          bet.statusLog.push({ date: bet.closed, status: o.status, outcome: bet.outcome });
        }
        data.bets.push(bet);
        enabledBetIds.add(o.id);
        stats.created++;
      } else {
        const b = o.target;
        ensureHistory(b, ['name', 'why']);
        const newName = pb.name || b.name, newWhy = pb.why !== undefined ? pb.why : (b.why || '');
        if (newName !== b.name || newWhy !== (b.why || '')) {
          b.name = newName;
          b.why = newWhy;
          b.history.push({ v: b.history.length + 1, date: now, name: newName, why: newWhy, reframe: true });
        }
        if (o.status !== betStatus(b)) {
          b.status = o.status;
          b.statusLog = b.statusLog || [];
          if (o.status === 'done' || o.status === 'dropped') {
            b.closed = planDate(pb.closed) || now;
            b.outcome = pb.outcome || '';
          } else { delete b.closed; }
          b.statusLog.push({ date: b.closed || now, status: o.status, outcome: b.outcome || '' });
        }
        enabledBetIds.add(b.id);
        stats.updated++;
      }
    });
    data.bets.forEach(b => { if (!imp.betOps.some(o => (o.kind === 'create' ? o.id : o.target.id) === b.id)) enabledBetIds.add(b.id); });
    imp.noteOps.forEach(n => {
      if (!n.on) return;
      setEntryBets(n.entry, n.ids.filter(id => enabledBetIds.has(id)));
      stats.notes++;
    });
    return stats;
  }

    container.innerHTML = '';
    const recency = b => { const lt = lastTouch(b.id); return lt ? new Date(lt).getTime() : 0; };
    const all = data.bets.filter(b => isActive(b) || selected.has(b.id))
      .sort((a, b) => recency(b) - recency(a));
    const open = !opts.collapsible || chipsOpen;
    const bets = open ? all : all.filter(b => selected.has(b.id));
    bets.forEach(b => {
      const c = el('button', 'chip' + (selected.has(b.id) ? ' on' : ''), b.name);
      c.type = 'button';
      c.title = b.name;
      c.addEventListener('click', () => {
        if (selected.has(b.id)) selected.delete(b.id); else selected.add(b.id);
        if (!open) { renderBetChips(container, selected, opts); return; }   // deselected chip disappears
        c.classList.toggle('on', selected.has(b.id));
        hint.style.display = selected.size ? 'none' : '';
      });
      container.appendChild(c);
    });
    if (opts.collapsible && all.length) {
      const t = el('button', 'chip more', open ? 'Done ▴' : (selected.size ? 'Bets ▸' : '+ Bets ▸'));
      t.type = 'button';
      t.title = open ? 'Hide the bet list' : 'Pick bets for this note';
      t.addEventListener('click', () => { chipsOpen = !chipsOpen; renderBetChips(container, selected, opts); });
      container.appendChild(t);
    }
    const hint = el('span', 'chip-hint', all.length ? 'None = general note' : 'General note (no active bets)');
    hint.style.display = selected.size ? 'none' : '';
    container.appendChild(hint);
  }
