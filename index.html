  // ---------- review ----------
  function renderReview() {
    const seg = document.getElementById('review-range');
    seg.innerHTML = '';
    RANGES.forEach(r => {
      const b = el('button', reviewRange === r.key ? 'on' : '', r.label);
      b.addEventListener('click', () => { reviewRange = r.key; render(); });
      seg.appendChild(b);
    });

    const box = document.getElementById('review');
    box.innerHTML = '';
    const r = rangeBounds(reviewRange);
    const entries = liveLog().filter(l => inRange(l.date, r));
    const card = el('div', 'review-card');
    card.appendChild(el('p', 'small-muted', r.label));
    card.lastChild.style.margin = '0 0 10px';

    // Stats
    const stats = el('div', 'stats');
    const stat = (n, l) => {
      const s = el('div', 'stat');
      s.appendChild(el('div', 'n', String(n)));
      s.appendChild(el('div', 'l', l));
      stats.appendChild(s);
      return s;
    };
    stat(entries.length, entries.length === 1 ? 'entry' : 'entries');
    const days = new Set(entries.map(e => new Date(e.date).toDateString()));
    if (reviewRange === 'week' || reviewRange === 'last') {
      const s = stat(countWorkdays(days, r.from) + '/5', 'workdays logged');
      const dots = el('div', 'dots');
      for (let i = 0; i < 5; i++) {
        dots.appendChild(el('span', 'dot' + (days.has(addDays(r.from, i).toDateString()) ? ' on' : '')));
      }
      s.appendChild(dots);
    } else {
      stat(days.size, days.size === 1 ? 'day logged' : 'days logged');
    }
    const closedInRange = data.bets.filter(b => isClosed(b) && b.closed && inRange(b.closed, r));
    stat(closedInRange.length, closedInRange.length === 1 ? 'bet closed' : 'bets closed');
    card.appendChild(stats);

    // Attention split
    const counts = new Map();
    entries.forEach(e => {
      const ids = entryBets(e).map(b => b.id);
      (ids.length ? ids : ['']).forEach(id => counts.set(id, (counts.get(id) || 0) + 1));
    });
    const rows = [...counts.entries()].map(([id, n]) => {
      const bet = data.bets.find(b => b.id === id);
      return { id, n, name: bet ? bet.name : 'General notes', general: !bet };
    }).sort((a, b) => (a.general - b.general) || (b.n - a.n));
    // More than 6 rows: top 5 bets, then one "Other" row (hover/tap lists the rest), then General notes.
    const betRows = rows.filter(x => !x.general), genRows = rows.filter(x => x.general);
    let shownRows = rows, otherRows = [];
    if (rows.length > 6) {
      otherRows = betRows.slice(5);
      shownRows = betRows.slice(0, 5);
      shownRows.push({ other: true, n: otherRows.reduce((t, x) => t + x.n, 0), name: 'Other · ' + plural(otherRows.length, 'bet', 'bets') });
      shownRows = shownRows.concat(genRows);
    }
    const max = Math.max(1, ...shownRows.filter(x => !x.other).map(x => x.n));
    if (rows.length) {
      card.appendChild(el('p', 'outcome-label', 'Where attention went'));
      card.lastChild.style.margin = '0 0 6px';
      shownRows.forEach(x => {
        const row = el('div', 'bar-row' + (x.other ? ' other' : ''));
        const left = el('div');
        left.appendChild(el('div', 'bar-label', x.name));
        const track = el('div', 'bar-track');
        const fill = el('div', 'bar-fill');
        fill.style.width = (100 * Math.min(x.n, max) / max) + '%';
        if (x.general) fill.style.background = 'var(--text-muted)';
        if (x.other) {
          fill.style.background = 'var(--border)';
          row.tabIndex = 0;
          row.setAttribute('aria-label', 'Other bets: ' + otherRows.map(o => o.name + ' ' + o.n).join(', '));
          const tip = el('div', 'tip');
          otherRows.forEach(o => tip.appendChild(el('div', '', o.name + ' · ' + o.n)));
          row.appendChild(tip);
          row.addEventListener('click', (e) => { e.stopPropagation(); row.classList.toggle('open'); });
        }
        track.appendChild(fill);
        left.appendChild(track);
        row.appendChild(left);
        row.appendChild(el('div', 'bar-n', String(x.n)));
        card.appendChild(row);
      });
    } else {
      card.appendChild(el('p', 'muted', 'Nothing logged in this period.'));
    }

    // Active bets that got no attention in this period
    if (reviewRange !== 'all') {
      const quiet = data.bets.filter(b => isActive(b) && !counts.has(b.id)
        && new Date(b.created || b.history[0].date) < r.to);
      if (quiet.length) {
        card.appendChild(el('p', 'untouched', 'No entries: ' + quiet.map(b => b.name).join(', ')));
      }
    }

    if (closedInRange.length) {
      card.appendChild(el('p', 'outcome-label', 'Closed'));
      closedInRange.forEach(b => {
        const p = el('p', 'bet-why', '');
        p.appendChild(el('strong', '', b.name));
        p.appendChild(statusPill(b));
        if (b.outcome) p.appendChild(document.createTextNode(' — ' + b.outcome));
        card.appendChild(p);
      });
    }
    box.appendChild(card);
  }

  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function countWorkdays(daySet, monday) {
    let n = 0;
    for (let i = 0; i < 5; i++) if (daySet.has(addDays(monday, i).toDateString())) n++;
    return n;
  }

  // Plain-text summary of the selected range, for pasting into a chat with an LLM.
  function buildReviewText() {
    const r = rangeBounds(reviewRange);
    const entries = liveLog().filter(l => inRange(l.date, r)).sort((a, b) => new Date(a.date) - new Date(b.date));
    const L = [];
    L.push('# Big picture review — ' + r.label);
    L.push('');
    L.push('## Active bets');
    const active = data.bets.filter(isActive);
    if (!active.length) L.push('(none)');
    active.forEach(b => {
      const n = entries.filter(e => entryBetIds(e).includes(b.id)).length;
      const lt = lastTouch(b.id);
      L.push('- **' + b.name + '** — started ' + fmtDate(b.created || b.history[0].date) +
        '; ' + n + (n === 1 ? ' entry' : ' entries') + ' in period' + (lt ? '; last touched ' + fmtDate(lt) : '; never logged'));
      if (b.why) L.push('  Why: ' + b.why.replace(/\n+/g, ' '));
    });
    const closed = data.bets.filter(b => isClosed(b) && b.closed && inRange(b.closed, r));
    if (closed.length) {
      L.push('');
      L.push('## Closed in this period');
      closed.forEach(b => {
        L.push('- **' + b.name + '** — ' + betStatus(b) + ' ' + fmtDate(b.closed) +
          ', ran ' + weeksBetween(b.created || b.history[0].date, b.closed) + ' wk, ' + plural(entriesFor(b.id).length, 'entry', 'entries') + ' total');
        if (b.outcome) L.push('  Outcome: ' + b.outcome.replace(/\n+/g, ' '));
      });
    }
    L.push('');
    L.push('## Log (' + plural(entries.length, 'entry', 'entries') + ')');
    let lastDay = '';
    entries.forEach(e => {
      const day = fmtDay(e.date);
      if (day !== lastDay) { L.push(''); L.push('### ' + day); lastDay = day; }
      const bn = entryBets(e).map(b => b.name).join(' + ');
      const na = (e.attachments || []).length;
      L.push('- ' + (e.ai ? '(AI summary) ' : '') + (bn ? '[' + bn + '] ' : '') + (e.text || '').replace(/\n+/g, ' / ') + (na ? ' (' + plural(na, 'image', 'images') + ' attached)' : ''));
    });
    if (!entries.length) L.push('(none)');
    return L.join('\n');
  }

  document.getElementById('copy-review-btn').addEventListener('click', async () => {
    const text = buildReviewText();
    const flag = document.getElementById('copied-flag');
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // Clipboard API can be blocked (e.g. some in-app browsers) — fall back to a file.
      downloadFile('big-picture-review.md', text, 'text/markdown;charset=utf-8;');
      flag.textContent = 'Downloaded';
    }
    flag.style.display = 'inline';
    setTimeout(() => { flag.style.display = 'none'; flag.textContent = 'Copied'; }, 2000);
  });

  // ---------- log ----------
  function renderLog() {
    const fsel = document.getElementById('filter-bet');
    betOptions(fsel, { includeClosed: true, selected: filterBet, extra: [['all', 'All entries'], ['general', 'General notes']] });
    filterBet = fsel.value;

    const seg = document.getElementById('log-view');
    seg.innerHTML = '';
    [['calendar', 'Calendar'], ['list', 'List']].forEach(([k, label]) => {
      const b = el('button', logView === k ? 'on' : '', label);
      b.addEventListener('click', () => { logView = k; logLimit = LOG_PAGE; render(); });
      seg.appendChild(b);
    });

    const q = filterText.toLowerCase();
    const byBet = betFiltered();
    const filtered = byBet
      .filter(e => !q || (e.text || '').toLowerCase().includes(q))
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    renderHeatmap(byBet, q ? new Set(filtered.map(e => dayKey(e.date))) : null);
    renderDeleted();

    const logList = document.getElementById('log-list');
    logList.innerHTML = '';
    const more = document.getElementById('log-more');
    if (logView === 'calendar' && !q) {
      more.style.display = 'none';
      return;
    }
    if (q) {
      const h = el('p', 'small-muted', plural(filtered.length, 'note', 'notes') + ' matching "' + filterText.trim() + '"');
      h.style.margin = '12px 0 0';
      logList.appendChild(h);
    }
    if (!filtered.length) {
      logList.appendChild(el('p', 'muted', data.log.length ? 'No matching entries.' : 'No entries yet.'));
      logList.lastChild.style.marginTop = '12px';
    }

    const shown = filtered.slice(0, logLimit);
    // Count per week across the whole filtered set, so headers stay right when paging.
    const weekCounts = new Map();
    filtered.forEach(e => {
      const k = weekStart(e.date).getTime();
      weekCounts.set(k, (weekCounts.get(k) || 0) + 1);
    });
    let currentWeek = null;
    shown.forEach(entry => {
      const wk = weekStart(entry.date).getTime();
      if (wk !== currentWeek) {
        currentWeek = wk;
        const h = el('div', 'week-head');
        h.appendChild(el('span', '', weekLabel(new Date(wk))));
        const n = weekCounts.get(wk);
        h.appendChild(el('span', '', n + (n === 1 ? ' entry' : ' entries')));
        logList.appendChild(h);
      }
      logList.appendChild(renderLogEntry(entry));
    });

    more.style.display = filtered.length > logLimit ? 'block' : 'none';
    document.getElementById('log-more-btn').textContent = 'Show older (' + (filtered.length - logLimit) + ' more)';
  }

  function betFiltered() {
    return liveLog().filter(e => filterBet === 'all' || (filterBet === 'general' ? !entryBets(e).length : entryBetIds(e).includes(filterBet)));
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(d) { const x = new Date(d); return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate()); }
  function keyToDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function fmtTime(d) { return new Date(d).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }

  // GitHub-style grid: one column per week (Mon at top), one square per day,
  // shaded by how many notes that day has under the current bet filter.
  // `matchDays` (when searching) dims every day without a matching note.
  function renderHeatmap(entries, matchDays) {
    const box = document.getElementById('heatmap');
    const prevScroll = box.querySelector('.heat-scroll');
    const keepLeft = prevScroll ? prevScroll.scrollLeft : null;
    box.innerHTML = '';
    const counts = new Map();
    entries.forEach(e => { const k = dayKey(e.date); counts.set(k, (counts.get(k) || 0) + 1); });

    const today = new Date();
    const lastWeek = weekStart(today);
    const fit = Math.floor(((box.clientWidth || 360) - 40) / 16);   // weeks that fit without scrolling
    let first = addDays(lastWeek, -7 * (Math.max(26, fit) - 1));
    if (entries.length) {
      const earliest = weekStart(entries.reduce((a, b) => new Date(a.date) < new Date(b.date) ? a : b).date);
      if (earliest < first) first = earliest;
    }
    const nWeeks = Math.round((lastWeek - first) / (7 * 86400000)) + 1;
    const todayKey = dayKey(today);
    const level = n => n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4;

    const wrap = el('div', 'heat');
    const days = el('div', 'heat-days');
    ['', 'Mon', '', 'Wed', '', 'Fri', '', 'Sun'].forEach(t => days.appendChild(el('span', '', t)));
    wrap.appendChild(days);
    const scroll = el('div', 'heat-scroll');
    const inner = el('div', 'heat-inner');
    const months = el('div', 'heat-months');
    const grid = el('div', 'heat-grid');
    let lastMonth = -1;
    let lastLabelW = -99;
    for (let w = 0; w < nWeeks; w++) {
      const monday = addDays(first, 7 * w);
      // Label a month on the first week whose Monday falls in it.
      if (monday.getMonth() !== lastMonth) {
        lastMonth = monday.getMonth();
        if (w - lastLabelW >= 3) {
          lastLabelW = w;
          const m = el('span', '', monday.toLocaleDateString(undefined, { month: 'short' }));
          m.style.left = (w * 16) + 'px';
          months.appendChild(m);
        }
      }
      for (let d = 0; d < 7; d++) {
        const day = addDays(monday, d);
        const k = dayKey(day);
        const n = counts.get(k) || 0;
        const c = el('button', 'cell');
        c.type = 'button';
        if (day > today && k !== todayKey) { c.className = 'cell future'; c.disabled = true; grid.appendChild(c); continue; }
        if (n) c.classList.add('l' + level(n), 'has');
        if (k === todayKey) c.classList.add('today');
        if (k === openDay) c.classList.add('sel');
        if (matchDays && !matchDays.has(k)) c.classList.add('dim');
        c.title = fmtDay(day) + ' — ' + (n ? plural(n, 'note', 'notes') : 'no notes');
        c.setAttribute('aria-label', c.title);
        if (n) c.addEventListener('click', () => { openDay = k; render(); });
        grid.appendChild(c);
      }
    }
    // Quarter bands under the grid, one per calendar quarter, aligned to its weeks.
    const quarters = el('div', 'heat-quarters');
    let qStart = 0, qKey = null;
    const qOf = d => d.getFullYear() * 4 + Math.floor(d.getMonth() / 3);
    const flushQ = (endW) => {
      if (qKey === null) return;
      const weeks = endW - qStart;
      const span = el('span', '', 'Q' + (qKey % 4 + 1) + ' ' + Math.floor(qKey / 4));
      span.style.left = (qStart * 16) + 'px';
      span.style.width = Math.max(0, weeks * 16 - 4) + 'px';
      if (weeks < 3) span.textContent = '';
      quarters.appendChild(span);
    };
    for (let w = 0; w < nWeeks; w++) {
      // A week belongs to the quarter of its Thursday (ISO-style), so bands don't split mid-week.
      const q = qOf(addDays(first, 7 * w + 3));
      if (q !== qKey) { flushQ(w); qKey = q; qStart = w; }
    }
    flushQ(nWeeks);
    quarters.style.width = (nWeeks * 16) + 'px';
    inner.appendChild(months);
    inner.appendChild(grid);
    inner.appendChild(quarters);
    scroll.appendChild(inner);
    wrap.appendChild(scroll);
    box.appendChild(wrap);

    // Footer: count over the visible span + legend
    const foot = el('div', 'heat-foot');
    foot.appendChild(el('span', '', plural(entries.length, 'note', 'notes') + ' on ' + plural(counts.size, 'day', 'days')));
    const legend = el('span', 'legend');
    legend.appendChild(document.createTextNode('Less '));
    [0, 1, 2, 3, 4].forEach(l => legend.appendChild(el('span', 'cell' + (l ? ' l' + l : ''))));
    legend.appendChild(document.createTextNode(' More'));
    foot.appendChild(legend);
    box.appendChild(foot);

    // Start scrolled to the newest week; afterwards keep the user's position.
    requestAnimationFrame(() => {
      if (!heatScrolledToEnd || keepLeft === null) {
        scroll.scrollLeft = scroll.scrollWidth;
        if (scroll.clientWidth) heatScrolledToEnd = true;   // only once actually visible
      }
      else scroll.scrollLeft = keepLeft;
    });
  }

  // Day card: every note of one day, scrollable; ‹ › step to the previous/next day with notes.
  function renderDaySheet() {
    let back = document.getElementById('day-sheet');
    if (!openDay) { if (back) back.remove(); document.body.style.overflow = ''; return; }
    const entries = betFiltered().filter(e => dayKey(e.date) === openDay)
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    const daysWith = [...new Set(betFiltered().map(e => dayKey(e.date)))].sort();
    const idx = daysWith.indexOf(openDay);
    const prevDay = idx > 0 ? daysWith[idx - 1] : (idx === -1 ? daysWith.filter(k => k < openDay).pop() : null);
    const nextDay = idx >= 0 ? daysWith[idx + 1] : daysWith.find(k => k > openDay);

    let keepTop = 0;
    if (back) {
      const body = back.querySelector('.sheet-body');
      if (body && back.dataset.day === openDay) keepTop = body.scrollTop;
      back.remove();
    }
    back = el('div', 'sheet-back');
    back.id = 'day-sheet';
    back.dataset.day = openDay;
    back.addEventListener('click', (e) => { if (e.target === back) closeDay(); });
    const sheet = el('div', 'sheet');
    sheet.setAttribute('role', 'dialog');
    const head = el('div', 'sheet-head');
    const title = el('div', 'sheet-title');
    title.appendChild(el('strong', '', keyToDate(openDay).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })));
    title.appendChild(el('span', '', plural(entries.length, 'note', 'notes')));
    const prevBtn = el('button', 'icon-btn', '‹');
    prevBtn.title = 'Previous day with notes';
    prevBtn.disabled = !prevDay;
    prevBtn.addEventListener('click', () => { openDay = prevDay; editingLogId = null; render(); });
    const nextBtn = el('button', 'icon-btn', '›');
    nextBtn.title = 'Next day with notes';
    nextBtn.disabled = !nextDay;
    nextBtn.addEventListener('click', () => { openDay = nextDay; editingLogId = null; render(); });
    const closeBtn = el('button', 'icon-btn', '×');
    closeBtn.title = 'Close';
    closeBtn.addEventListener('click', closeDay);
    head.appendChild(title);
    head.appendChild(prevBtn);
    head.appendChild(nextBtn);
    head.appendChild(closeBtn);
    const body = el('div', 'sheet-body');
    if (!entries.length) body.appendChild(el('p', 'muted', 'No notes this day.'));
    entries.forEach(e => body.appendChild(renderLogEntry(e, { showTime: true })));
    sheet.appendChild(head);
    sheet.appendChild(body);
    back.appendChild(sheet);
    document.body.appendChild(back);
    document.body.style.overflow = 'hidden';
    body.scrollTop = keepTop;
  }
  function closeDay() { openDay = null; editingLogId = null; render(); }
  document.addEventListener('keydown', (e) => {
    if (!openDay || document.querySelector('.lightbox')) return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') closeDay();
    else if (e.key === 'ArrowLeft') document.querySelector('#day-sheet .icon-btn:nth-of-type(1)')?.click();
    else if (e.key === 'ArrowRight') document.querySelector('#day-sheet .icon-btn:nth-of-type(2)')?.click();
  });

  // ---------- delete / undo / restore ----------
  let toastTimer = null;
  function showToast(text, actionLabel, onAction) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    clearTimeout(toastTimer);
    const t = el('div', 'toast');
    t.appendChild(el('span', '', text));
    if (actionLabel) {
      const a = el('a', '', actionLabel);
      a.addEventListener('click', () => { t.remove(); onAction(); });
      t.appendChild(a);
    }
    document.body.appendChild(t);
    toastTimer = setTimeout(() => t.remove(), 7000);
  }
  async function deleteEntry(entry) {
    entry.deleted = new Date().toISOString();
    render();
    showToast('Note deleted', 'Undo', () => restoreEntry(entry));
    await save();
  }
  async function restoreEntry(entry) {
    delete entry.deleted;
    render();
    await save();
  }
  function renderDeleted() {
    const box = document.getElementById('deleted-box');
    box.innerHTML = '';
    const deleted = data.log.filter(e => e.deleted).sort((a, b) => new Date(b.deleted) - new Date(a.deleted));
    if (!deleted.length) return;
    const head = el('div', 'toggle-head');
    head.style.margin = '18px 0 8px';
    head.appendChild(el('span', 'small-muted', 'Deleted notes (' + deleted.length + ')'));
    head.appendChild(el('span', 'link-btn', showDeleted ? 'Hide' : 'Show'));
    head.addEventListener('click', () => { showDeleted = !showDeleted; render(); });
    box.appendChild(head);
    if (!showDeleted) return;
    deleted.forEach(e => {
      const w = el('div', 'log-entry');
      w.style.opacity = '0.75';
      w.appendChild(el('p', 'log-date', fmtDay(e.date) + ' · deleted ' + fmtDate(e.deleted)));
      if (e.text) appendExpandableText(w, 'del-' + e.id, e.text, LOG_LIMIT, 'log-text');
      if (e.attachments && e.attachments.length) {
        const row = el('div', 'att-row');
        e.attachments.forEach(a => row.appendChild(attThumb(a, {})));
        w.appendChild(row);
      }
      const actions = el('div', 'card-actions');
      actions.appendChild(linkBtn('Restore', () => restoreEntry(e)));
      w.appendChild(actions);
      box.appendChild(w);
    });
  }

  const AI_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9zM5 15l.7 1.8 1.8.7-1.8.7L5 20l-.7-1.8L2.5 17.5l1.8-.7z"/></svg>';
  function aiBadge() {
    const b = el('span', 'ai-badge');
    b.innerHTML = AI_ICON;
    b.appendChild(document.createTextNode('AI summary'));
    b.title = 'Marked as an AI summary';
    return b;
  }

  // ⋮ menu; items = [[label, onClick, className?]]. One open at a time; closes on outside tap or Esc.
  function kebabMenu(items) {
    const wrap = el('span', 'kebab-wrap');
    const btn = el('button', 'kebab', '⋮');
    btn.type = 'button';
    btn.title = 'More';
    btn.setAttribute('aria-haspopup', 'menu');
    btn.setAttribute('aria-expanded', 'false');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = wrap.querySelector('.menu');
      closeMenus();
      if (open) return;
      const menu = el('div', 'menu');
      menu.setAttribute('role', 'menu');
      items.forEach(([label, onClick, cls]) => {
        const it = el('button', cls || '', label);
        it.type = 'button';
        it.setAttribute('role', 'menuitem');
        it.addEventListener('click', (ev) => { ev.stopPropagation(); closeMenus(); onClick(); });
        menu.appendChild(it);
      });
      wrap.appendChild(menu);
      btn.setAttribute('aria-expanded', 'true');
    });
    wrap.appendChild(btn);
    return wrap;
  }
  function closeMenus() {
    document.querySelectorAll('.kebab-wrap .menu').forEach(m => m.remove());
    document.querySelectorAll('.kebab[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }
  document.addEventListener('click', closeMenus);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });

  function renderLogEntry(entry, opts = {}) {
    ensureHistory(entry, ['text']);
    const bets = entryBets(entry);
    const wrapper = el('div', 'log-entry');

    if (editingLogId === entry.id) {
      const sel = new Set(bets.map(b => b.id));
      const chips = el('div', 'chips');
      renderBetChips(chips, sel);
      const comp = makeComposer({ text: entry.text || '', atts: entry.attachments || [], ai: !!entry.ai });
      const saveBtn = el('button', '', 'Save');
      const cancelBtn = el('button', '', 'Cancel');
      comp.bar.prepend(cancelBtn);
      comp.bar.prepend(saveBtn);
      wrapper.appendChild(chips);
      wrapper.appendChild(comp.root);

      saveBtn.addEventListener('click', async () => {
        const newText = comp.ta.value.trim();
        if (!newText && !comp.state.atts.length) return;
        if (comp.isBusy()) { alert('Still processing images — try again in a second.'); return; }
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        try {
          const attachments = await comp.commit();
          if (newText !== (entry.text || '')) {
            entry.history.push({ v: entry.history.length + 1, date: new Date().toISOString(), text: newText });
          }
          entry.text = newText;
          setEntryBets(entry, [...sel]);
          if (attachments.length) entry.attachments = attachments; else delete entry.attachments;
          if (comp.state.ai) entry.ai = true; else delete entry.ai;
          editingLogId = null;
          render();
          await save();
        } catch (e) {
          console.error(e);
          alert('Saving images failed: ' + e.message);
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';
        }
      });
      cancelBtn.addEventListener('click', () => { editingLogId = null; render(); });
      return wrapper;
    }

    if (entry.ai) wrapper.classList.add('ai');
    const dateP = el('p', 'log-date', opts.showTime ? fmtTime(entry.date) : fmtDay(entry.date));
    bets.forEach((b, i) => {
      dateP.appendChild(document.createTextNode((i === 0 ? ' · ' : ' + ') + b.name));
      if (!isActive(b)) dateP.appendChild(statusPill(b));
    });
    if (entry.ai) dateP.appendChild(aiBadge());
    wrapper.appendChild(dateP);
    if (entry.text) appendExpandableText(wrapper, entry.id, entry.text, LOG_LIMIT, 'log-text');
    if (entry.attachments && entry.attachments.length) {
      const row = el('div', 'att-row');
      entry.attachments.forEach(a => row.appendChild(attThumb(a, {})));
      wrapper.appendChild(row);
    }

    bets.forEach(bet => {
      ensureHistory(bet, ['name', 'why']);
      const versionAtLog = betVersionAtDate(bet, entry.date);
      const currentVersion = bet.history.length;
      // Versions marked `reframe` (wording updates, e.g. from an import) don't count as the bet changing.
      if (versionAtLog !== currentVersion && bet.history.slice(versionAtLog).some(h => !h.reframe)) {
        const who = bets.length > 1 ? '"' + bet.name + '"' : 'Bet';
        wrapper.appendChild(el('span', 'stale-flag', who + ' has changed since this entry (was v' + versionAtLog + ', now v' + currentVersion + ')'));
        wrapper.appendChild(document.createTextNode(' '));
      }
    });

    const actions = el('div', 'card-actions');
    actions.appendChild(linkBtn('Edit', () => { editingLogId = entry.id; render(); }));
    if (entry.history.length > 1) {
      actions.appendChild(linkBtn(expandedLogHistory === entry.id ? 'Hide history' : 'History (v' + entry.history.length + ')', () => {
        expandedLogHistory = expandedLogHistory === entry.id ? null : entry.id;
        render();
      }));
    }
    // Soft delete: kept in the document (and the activity export); Undo toast + "Deleted notes" to restore.
    actions.appendChild(kebabMenu([
      [entry.ai ? 'Unmark AI summary' : 'Mark as AI summary', async () => {
        if (entry.ai) delete entry.ai; else entry.ai = true;
        render();
        await save();
      }],
      ['Delete', () => deleteEntry(entry), 'danger'],
    ]));
    wrapper.appendChild(actions);

    if (expandedLogHistory === entry.id) {
      appendHistoryPanel(wrapper, entry.history, 'log-' + entry.id, (content, h) => {
        appendExpandableText(content, 'histv-log-' + entry.id + '-v' + h.v, h.text || '', LOG_LIMIT, 'log-text');
      });
    }
    return wrapper;
  }

  // ---------- images ----------
  // Pictures are downscaled in the browser and stored as JPEG data URLs in their
  // own Firestore docs (full + thumbnail), never in the main document.
  const FULL_MAX = 1600;
  const FULL_BUDGET = 700000;   // data-URL chars, well under the 1 MB doc limit
  const THUMB_MAX = 240;
  const thumbCache = new Map();
  const fullCache = new Map();
  const imgDoc = (kind, id) => doc(db, 'bigpicture', syncId + '__' + kind + '_' + id);

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('this image format isn\'t supported by the browser')); };
      img.src = url;
    });
  }
  function drawScaled(img, maxDim, quality) {
    const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';            // flatten transparent PNGs/screenshots
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return { data: c.toDataURL('image/jpeg', quality), w, h };
  }
  async function processImage(file) {
    const { img, url } = await loadImage(file);
    try {
      let dim = FULL_MAX, q = 0.82;
      let full = drawScaled(img, dim, q);
      while (full.data.length > FULL_BUDGET && dim > 500) {
        dim = Math.round(dim * 0.8);
        q = Math.max(0.6, q - 0.05);
        full = drawScaled(img, dim, q);
      }
      const thumb = drawScaled(img, THUMB_MAX, 0.7).data;
      const id = 'img_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      return { id, full: full.data, thumb, w: full.w, h: full.h, pending: true };
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  async function uploadAtt(a) {
    const created = new Date().toISOString();
    await setDoc(imgDoc('img', a.id), { data: a.full, w: a.w, h: a.h, created });
    await setDoc(imgDoc('thm', a.id), { data: a.thumb, created });
  }
  function cachedGet(cache, kind, id) {
    if (!cache.has(id)) {
      cache.set(id, getDoc(imgDoc(kind, id))
        .then(snap => snap.exists() ? snap.data().data : null)
        .catch(e => { console.error('image load failed', e); cache.delete(id); return null; }));
    }
    return cache.get(id);
  }
  const loadThumb = id => cachedGet(thumbCache, 'thm', id);
  const loadFull = id => cachedGet(fullCache, 'img', id);

  // A small clickable thumbnail. `att` is either a stored {id,w,h} or a pending
  // processed image (with .thumb/.full data URLs) not yet uploaded.
  function attThumb(att, { onRemove }) {
    const b = el('button', 'att');
    b.type = 'button';
    b.title = 'Open picture';
    const img = el('img');
    img.alt = '';
    if (att.pending) {
      img.src = att.thumb;
      b.appendChild(img);
    } else {
      const ph = el('span', 'ph', '…');
      b.appendChild(ph);
      loadThumb(att.id).then(src => {
        if (src) { img.src = src; ph.replaceWith(img); } else { ph.textContent = 'missing'; }
      });
    }
    b.addEventListener('click', () => {
      openLightbox(img.src || null, att.pending ? Promise.resolve(att.full) : loadFull(att.id));
    });
    if (onRemove) {
      const x = el('span', 'x', '×');
      x.title = 'Remove';
      x.addEventListener('click', (e) => { e.stopPropagation(); onRemove(); });
      b.appendChild(x);
    }
    return b;
  }

  function openLightbox(previewSrc, fullPromise) {
    const box = el('div', 'lightbox');
    const img = el('img');
    img.alt = '';
    if (previewSrc) img.src = previewSrc;
    box.appendChild(img);
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
    box.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(box);
    fullPromise.then(src => { if (src) img.src = src; });
  }

  // Text box + attachments: paste, drag-and-drop or the Attach button add pictures.
  function makeComposer({ text = '', atts = [], placeholder = '', ai = false }) {
    const root = el('div', 'composer');
    const ta = el('textarea');
    ta.value = text;
    ta.placeholder = placeholder;
    const row = el('div', 'att-row');
    const bar = el('div', 'compose-bar');
    const file = el('input');
    file.type = 'file';
    file.accept = 'image/*';
    file.multiple = true;
    file.style.display = 'none';
    const attachBtn = el('button', 'small', '📎 Attach');
    attachBtn.type = 'button';
    attachBtn.addEventListener('click', () => file.click());
    bar.appendChild(attachBtn);
    const aiBtn = el('button', 'small ai-toggle');
    aiBtn.type = 'button';
    aiBtn.innerHTML = AI_ICON;
    aiBtn.appendChild(document.createTextNode('AI summary'));
    aiBtn.title = 'Mark this note as an AI summary';
    const setAi = (v) => { state.ai = v; aiBtn.setAttribute('aria-pressed', v ? 'true' : 'false'); root.classList.toggle('ai', v); };
    aiBtn.addEventListener('click', () => setAi(!state.ai));
    bar.appendChild(aiBtn);
    bar.appendChild(file);

    const state = { atts: [...atts], busy: 0, ai: false };
    setAi(ai);
    function drawAtts() {
      row.innerHTML = '';
      state.atts.forEach(a => row.appendChild(attThumb(a, {
        onRemove: () => { state.atts = state.atts.filter(x => x !== a); drawAtts(); }
      })));
      for (let i = 0; i < state.busy; i++) {
        const ph = el('div', 'att');
        ph.appendChild(el('span', 'ph', 'Adding…'));
        row.appendChild(ph);
      }
      row.style.display = row.childNodes.length ? '' : 'none';
    }
    async function addFiles(files) {
      const imgs = [...files].filter(f => f && f.type && f.type.startsWith('image/'));
      if (!imgs.length) return;
      state.busy += imgs.length;
      drawAtts();
      for (const f of imgs) {
        try {
          state.atts.push(await processImage(f));
        } catch (e) {
          alert('Couldn\'t add ' + (f.name || 'picture') + ': ' + e.message);
        } finally {
          state.busy--;
          drawAtts();
        }
      }
    }

    ta.addEventListener('paste', (e) => {
      const items = [...((e.clipboardData && e.clipboardData.items) || [])];
      const files = items.filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
      if (!files.length) return;
      if (!e.clipboardData.getData('text/plain')) e.preventDefault();
      addFiles(files);
    });
    root.addEventListener('dragover', (e) => {
      if (![...e.dataTransfer.types].includes('Files')) return;
      e.preventDefault();
      root.classList.add('dragging');
    });
    root.addEventListener('dragleave', (e) => { if (!root.contains(e.relatedTarget)) root.classList.remove('dragging'); });
    root.addEventListener('drop', (e) => {
      if (!e.dataTransfer.files.length) return;
      e.preventDefault();
      e.stopPropagation();
      root.classList.remove('dragging');
      addFiles(e.dataTransfer.files);
    });
    file.addEventListener('change', () => { addFiles(file.files); file.value = ''; });

    root.appendChild(ta);
    root.appendChild(row);
    root.appendChild(bar);
    drawAtts();
    requestAnimationFrame(() => autosize(ta));

    return {
      root, ta, bar, state, addFiles,
      isBusy: () => state.busy > 0,
      // Uploads pending pictures; returns the attachment list to store on the entry.
      async commit() {
        for (const a of state.atts.filter(x => x.pending)) {
          await uploadAtt(a);
          thumbCache.set(a.id, Promise.resolve(a.thumb));
          fullCache.set(a.id, Promise.resolve(a.full));
          a.pending = false;
        }
        return state.atts.map(a => ({ id: a.id, w: a.w, h: a.h }));
      },
      reset() { ta.value = ''; state.atts = []; setAi(false); drawAtts(); autosize(ta); },
    };
  }

  function autosize(t) {
    if (!t.offsetParent) return;      // hidden; sized when shown
    t.style.height = 'auto';
    t.style.height = (t.scrollHeight + 2) + 'px';
  }
  document.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') autosize(e.target); });

  function scrollToLog() {
    document.getElementById('filter-bet').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('filter-bet').addEventListener('change', (e) => {
    filterBet = e.target.value;
    logLimit = LOG_PAGE;
    render();
  });
  document.getElementById('filter-text').addEventListener('input', (e) => {
    filterText = e.target.value;
    logLimit = LOG_PAGE;
    renderLog();
  });
  document.getElementById('log-more-btn').addEventListener('click', () => {
    logLimit += LOG_PAGE * 2;
    renderLog();
  });

  // ---------- add bet / add entry ----------
  document.getElementById('add-bet-btn').addEventListener('click', () => {
    openFold('bets');
    document.getElementById('add-bet-form').style.display = 'block';
    document.getElementById('bet-name').focus();
  });
  document.getElementById('cancel-bet-btn').addEventListener('click', () => {
    document.getElementById('add-bet-form').style.display = 'none';
    document.getElementById('bet-name').value = '';
    document.getElementById('bet-why').value = '';
  });
  document.getElementById('save-bet-btn').addEventListener('click', async () => {
    const name = document.getElementById('bet-name').value.trim();
    const why = document.getElementById('bet-why').value.trim();
    if (!name) return;
    const created = new Date().toISOString();
    data.bets.push({ id: 'bet_' + Date.now(), name, why, created, status: 'active', history: [{ v: 1, date: created, name, why }] });
    document.getElementById('bet-name').value = '';
    document.getElementById('bet-why').value = '';
    document.getElementById('add-bet-form').style.display = 'none';
    render();
    await save();
  });

  const logComposer = makeComposer({ placeholder: 'What did you actually spend attention on today? (Paste or drop pictures here)' });
  logComposer.ta.id = 'log-text';
  const addEntryBtn = el('button', '', 'Add entry');
  addEntryBtn.id = 'save-log-btn';
  logComposer.bar.prepend(addEntryBtn);
  document.getElementById('log-composer').appendChild(logComposer.root);
  const composeHint = el('div', 'compose-hint');
  logComposer.root.insertBefore(composeHint, logComposer.ta.nextSibling);

  // ----- Haiku bet suggestions -----
  // Optional. The Anthropic API key is asked for on the first Suggest tap per device and kept
  // only in this browser's localStorage — never in the repo or the synced doc.
  const AI_KEY = 'bp-anthropic-key';
  const AI_MODEL = 'claude-haiku-5-5';
  const desktopKeys = window.matchMedia('(pointer: fine)').matches;
  function aiKey() { try { return localStorage.getItem(AI_KEY) || ''; } catch (e) { return ''; } }
  let hintMsg = null;                       // {html} override while/after a suggestion
  function renderComposeHint() {
    composeHint.innerHTML = '';
    if (hintMsg) { composeHint.appendChild(hintMsg); return; }
    if (!desktopKeys) return;
    const k = (t) => el('kbd', '', t);
    composeHint.append(k('Enter'), ' add entry · ', k('Shift'), '+', k('Enter'), ' new line');
  }
  const suggestBtn = el('button', 'small ai-suggest', '✦ Suggest bets');
  suggestBtn.type = 'button';
  suggestBtn.title = 'Ask Haiku which bets this note belongs to';
  suggestBtn.addEventListener('click', () => suggestBets());
  logComposer.bar.insertBefore(suggestBtn, logComposer.bar.children[1] || null);
  function refreshSuggestBtn() {}

  function betBriefs() {
    return data.bets.filter(isActive).map(b => {
      const recent = entriesFor(b.id).sort((x, y) => new Date(y.date) - new Date(x.date)).slice(0, 3)
        .map(e => '    - ' + (e.text || '').replace(/\s+/g, ' ').slice(0, 220));
      return '- id: ' + b.id + '\n  name: ' + b.name + '\n  why: ' + (b.why || '').replace(/\s+/g, ' ') +
        (recent.length ? '\n  recent notes:\n' + recent.join('\n') : '');
    }).join('\n');
  }

  let suggesting = false;
  async function suggestBets() {
    const text = logComposer.ta.value.trim();
    let key = aiKey();
    const say = (cls, t) => { hintMsg = el('span', cls, t); renderComposeHint(); };
    if (!key) {
      // First use on this device: ask once; stored only in this browser.
      const v = prompt('Paste an Anthropic API key so Haiku can suggest bets. It is stored only in this browser.');
      if (!v || !v.trim()) return;
      try { localStorage.setItem(AI_KEY, v.trim()); } catch (e) {}
      key = v.trim();
    }
    if (!text) { say('err', 'Write the note first, then ask for bets.'); return; }
    if (suggesting) return;
    const active = data.bets.filter(isActive);
    if (!active.length) { say('err', 'No active bets to choose from.'); return; }
    suggesting = true;
    say('ai-note', '✦ Asking Haiku…');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: AI_MODEL,
          max_tokens: 1024,
          system: 'You tag work-log notes written by a manufacturing engineer with the "bets" (multi-week initiatives) they belong to.\n' +
            'Pick only bets the note is clearly about — usually 0 to 2, at most 3. A passing mention is not enough. ' +
            'If nothing fits, return an empty list (it becomes a general note).\n' +
            'Reply with JSON only, no prose: {"bet_ids": ["<id>", ...]}\n\nActive bets:\n' + betBriefs(),
          messages: [{ role: 'user', content: 'Note:\n' + text }],
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) { try { localStorage.removeItem(AI_KEY); } catch (e) {} }   // bad key: ask again next time
      if (!res.ok) throw new Error((body.error && body.error.message) || ('HTTP ' + res.status));
      const out = (body.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
      const m = out.match(/\{[\s\S]*\}/);
      const ids = ((m && JSON.parse(m[0]).bet_ids) || []).filter(id => active.some(b => b.id === id));
      ids.forEach(id => composeBets.add(id));
      renderLogSelect();          // selected bets show even while the list is folded
      say('ai-note', ids.length
        ? '✦ Haiku: ' + ids.map(id => active.find(b => b.id === id).name).join(' + ') + (desktopKeys ? ' — adjust, then Enter to add' : '')
        : '✦ Haiku: no bet fits — general note' + (desktopKeys ? ' (Enter to add)' : ''));
    } catch (e) {
      console.error('suggest failed', e);
      say('err', 'Haiku failed: ' + e.message);
    } finally {
      suggesting = false;
    }
  }

  // Desktop: Enter adds the entry; Shift+Enter (browser default) makes a new line.
  logComposer.ta.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing || !desktopKeys || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    addEntryBtn.click();
  });
  logComposer.ta.addEventListener('input', () => { if (hintMsg && hintMsg.classList.contains('err')) { hintMsg = null; renderComposeHint(); } });
  renderComposeHint();
  refreshSuggestBtn();

  // =====================================================================
  // Summaries: compress the log in three layers so nothing has to re-read an
  // ever-growing pile of notes.
  //   - this month: raw notes
  //   - earlier months of this quarter: one summary per month
  //   - earlier quarters: one chapter per quarter (written once from its three
  //     month summaries and then KEPT, never re-summarised), plus a short
  //     "where things stand" header rebuilt from all chapters each quarter.
  // Summaries are organised per bet with dated facts, drafted by Claude,
  // reviewed/edited by you, then saved. Raw notes are never deleted.
  //   data.summaries = { months: {'2026-10': S}, quarters: {'2026-Q3': S}, header: S & {asof:'2026-Q3'} }
  //   S = { text, created, edited?, model? }
  // =====================================================================
  const SUM_MODEL = 'claude-opus-5-5';
  const monthKey = d => { const x = new Date(d); return x.getFullYear() + '-' + pad2(x.getMonth() + 1); };
  const quarterOfMonth = mk => { const [y, m] = mk.split('-').map(Number); return y + '-Q' + (Math.floor((m - 1) / 3) + 1); };
  const quarterMonths = qk => { const [y, q] = qk.split('-Q').map(Number); return [1, 2, 3].map(i => y + '-' + pad2((q - 1) * 3 + i)); };
  const nextMonth = mk => { const [y, m] = mk.split('-').map(Number); return m === 12 ? (y + 1) + '-01' : y + '-' + pad2(m + 1); };
  const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); };
  const quarterLabel = qk => qk.replace('-Q', ' Q').replace(/^(\d+) (Q\d)$/, '$2 $1');
  function sums() {
    data.summaries = data.summaries || {};
    data.summaries.months = data.summaries.months || {};
    data.summaries.quarters = data.summaries.quarters || {};
    return data.summaries;
  }
  const notesInMonth = mk => liveLog().filter(e => monthKey(e.date) === mk).sort((a, b) => new Date(a.date) - new Date(b.date));

  // Completed periods that still need a summary, in the order they should be written:
  // months, then each finished quarter's chapter, then the header for the latest chapter.
  function pendingSummaries() {
    const log = liveLog();
    if (!log.length) return [];
    const S = sums();
    const curMonth = monthKey(new Date()), curQuarter = quarterOfMonth(curMonth);
    const first = monthKey(log.reduce((a, b) => new Date(a.date) < new Date(b.date) ? a : b).date);
    const out = [];
    let latestChapter = null, headerAt = 0;
    for (let mk = first; mk < curMonth; mk = nextMonth(mk)) {
      if (!S.months[mk] && notesInMonth(mk).length) out.push({ kind: 'month', key: mk });
      const qk = quarterOfMonth(mk);
      if (quarterMonths(qk)[2] === mk && qk < curQuarter && quarterMonths(qk).some(m => notesInMonth(m).length)) {
        if (!S.quarters[qk]) out.push({ kind: 'quarter', key: qk });
        latestChapter = qk;
        headerAt = out.length;                     // header goes right after the latest chapter
      }
    }
    // Only the newest header matters; it is rebuilt from all kept chapters.
    if (latestChapter && (!S.header || S.header.asof !== latestChapter)) out.splice(headerAt, 0, { kind: 'header', key: latestChapter });
    return out;
  }

  // Plain-text rendering of notes for prompts and exports.
  function noteLine(e) {
    const bn = entryBets(e).map(b => b.name).join(' + ');
    const na = (e.attachments || []).length;
    return '- ' + fmtDay(e.date) + (bn ? ' [' + bn + ']' : ' [general]') + (e.ai ? ' (AI summary)' : '') + ': ' +
      (e.text || '').replace(/\n+/g, ' / ') + (na ? ' (' + plural(na, 'picture', 'pictures') + ')' : '');
  }
  function betsContext() {
    return data.bets.map(b => '- ' + b.name + ' — ' + STATUS_LABEL[betStatus(b)] +
      (b.closed ? ' ' + fmtDate(b.closed) : '') + (b.why ? '\n  why: ' + b.why.replace(/\s+/g, ' ') : '') +
      (b.outcome ? '\n  outcome: ' + b.outcome.replace(/\s+/g, ' ') : '')).join('\n');
  }

  // The layered view "as of" a month: story header + chapters before that month's
  // quarter, month summaries earlier in the quarter, then raw notes of the month.
  // Months that were never summarised fall back to their raw notes, so nothing is lost.
  function layeredSections(asOfMonth, opts = {}) {
    const S = sums();
    const q = quarterOfMonth(asOfMonth);
    const sec = [];
    if (S.header && S.header.asof < q) sec.push({ layer: 'story', period: 'as of ' + quarterLabel(S.header.asof), text: S.header.text });
    Object.keys(S.quarters).filter(k => k < q).sort().forEach(k => sec.push({ layer: 'chapter', period: k, text: S.quarters[k].text }));
    // Quarters before `q` without a chapter: use their month summaries / raw notes.
    const allMonths = [...new Set(liveLog().map(e => monthKey(e.date)))].sort();
    allMonths.filter(m => quarterOfMonth(m) < q && !S.quarters[quarterOfMonth(m)]).forEach(m => {
      if (S.months[m]) sec.push({ layer: 'month', period: m, text: S.months[m].text });
      else notesInMonth(m).forEach(e => sec.push({ layer: 'note', period: m, note: e }));
    });
    quarterMonths(q).filter(m => m < asOfMonth).forEach(m => {
      if (S.months[m]) sec.push({ layer: 'month', period: m, text: S.months[m].text });
      else notesInMonth(m).forEach(e => sec.push({ layer: 'note', period: m, note: e }));
    });
    if (opts.includeMonth !== false) {
      allMonths.filter(m => m >= asOfMonth).forEach(m => notesInMonth(m).forEach(e => sec.push({ layer: 'note', period: m, note: e })));
    }
    return sec;
  }
  function sectionsToText(sec) {
    const L = [];
    let lastLayer = null, lastPeriod = null;
    sec.forEach(x => {
      if (x.layer === 'note') {
        if (lastLayer !== 'note' || lastPeriod !== x.period) L.push('', '### Notes — ' + monthLabel(x.period));
        L.push(noteLine(x.note));
      } else {
        L.push('', x.layer === 'story' ? '### Story so far (' + x.period + ')' : x.layer === 'chapter' ? '### Chapter ' + quarterLabel(x.period) : '### Summary — ' + monthLabel(x.period), x.text.trim());
      }
      lastLayer = x.layer; lastPeriod = x.period;
    });
    return L.join('\n').trim();
  }

  const SUM_RULES =
    'Rules:\n' +
    '- Organise by bet: one "### <bet name>" section per bet that had activity, then "### General" for notes with no bet. Skip bets with no activity.\n' +
    '- Under each, dated bullets ("- 14 Oct: …") of what happened, decisions and WHY, and the state at the end of the period.\n' +
    '- Keep concrete facts exactly: dates, part numbers, drawing numbers, supplier and people names, quantities, costs, lead times. Never invent or generalise them away.\n' +
    '- Only use what the material says. No advice, no praise, no filler. Plain markdown, no preamble.';

  function buildPrompt(item) {
    const S = sums();
    if (item.kind === 'month') {
      const ctx = layeredSections(item.key, { includeMonth: false });
      return {
        system: 'You maintain the work history of a manufacturing engineer at Teledyne Gavia (AUV maker). ' +
          'His job: products built at high quality, best reliability and cycle times, low cost.\n' +
          'Write the summary of ONE month from that month\'s raw log notes. Earlier history is given only as context — do not summarise it again.\n' +
          'Start with "## ' + monthLabel(item.key) + '".\n' + SUM_RULES,
        user: 'Bets (current state):\n' + betsContext() +
          (ctx.length ? '\n\nEarlier history (context only):\n' + sectionsToText(ctx) : '') +
          '\n\nRaw notes for ' + monthLabel(item.key) + ':\n' + notesInMonth(item.key).map(noteLine).join('\n'),
      };
    }
    if (item.kind === 'quarter') {
      const months = quarterMonths(item.key);
      return {
        system: 'You maintain the work history of a manufacturing engineer at Teledyne Gavia (AUV maker).\n' +
          'Write the chapter for ONE quarter by consolidating its monthly summaries (raw notes are given for any month without a summary). ' +
          'This chapter is kept permanently and never re-summarised, so it must stand on its own.\n' +
          'Start with "## ' + quarterLabel(item.key) + '". For each bet: when it started or what state it entered the quarter in, the dated milestones and decisions (with why), and its state at quarter end.\n' + SUM_RULES,
        user: 'Bets (current state):\n' + betsContext() + '\n\n' + months.map(m => S.months[m]
          ? '### Summary — ' + monthLabel(m) + '\n' + S.months[m].text.trim()
          : (notesInMonth(m).length ? '### Notes — ' + monthLabel(m) + '\n' + notesInMonth(m).map(noteLine).join('\n') : '')).filter(Boolean).join('\n\n'),
      };
    }
    // header: rebuilt from ALL kept chapters, never from the previous header
    const chapters = Object.keys(S.quarters).filter(k => k <= item.key).sort();
    return {
      system: 'You maintain the work history of a manufacturing engineer at Teledyne Gavia (AUV maker).\n' +
        'Write a short "Where things stand" overview as of the end of ' + quarterLabel(item.key) + ', from the quarterly chapters below. ' +
        'At most ~250 words: one bullet per active bet (state, last milestone with date, what blocks it), one line per bet closed so far (outcome), and recurring themes worth knowing. ' +
        'Start with "## Where things stand — ' + quarterLabel(item.key) + '". Keep dates and names exact; nothing that is not in the chapters.',
      user: 'Bets (current state):\n' + betsContext() + '\n\n' + chapters.map(k => '### Chapter ' + quarterLabel(k) + '\n' + S.quarters[k].text.trim()).join('\n\n'),
    };
  }

  async function ensureKey() {
    let key = aiKey();
    if (key) return key;
    const v = prompt('Paste an Anthropic API key so Claude can draft summaries. It is stored only in this browser.');
    if (!v || !v.trim()) return null;
    try { localStorage.setItem(AI_KEY, v.trim()); } catch (e) {}
    return v.trim();
  }
  async function callClaude(model, system, user, maxTokens) {
    const key = await ensureKey();
    if (!key) throw new Error('No API key');
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json', 'x-api-key': key,
        'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({ model, max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) { try { localStorage.removeItem(AI_KEY); } catch (e) {} }
    if (!res.ok) throw new Error((body.error && body.error.message) || ('HTTP ' + res.status));
    const text = (body.content || []).filter(c => c.type === 'text').map(c => c.text).join('').trim();
    if (!text) throw new Error('Empty response');
    return text;
  }

  const itemTitle = it => it.kind === 'month' ? monthLabel(it.key) + ' summary'
    : it.kind === 'quarter' ? 'Chapter ' + quarterLabel(it.key) : 'Where things stand — ' + quarterLabel(it.key);
  const storedFor = it => { const S = sums(); return it.kind === 'month' ? S.months[it.key] : it.kind === 'quarter' ? S.quarters[it.key] : S.header; };

  function renderSummaryBanner() {
    const box = document.getElementById('sum-banner');
    box.innerHTML = '';
    const pend = pendingSummaries();
    if (!pend.length) return;
    const it = pend[0];
    const b = el('div', 'sum-banner');
    const t = el('div', 'grow');
    t.appendChild(el('strong', '', it.kind === 'month' ? monthLabel(it.key) + ' has ended.' : it.kind === 'quarter' ? quarterLabel(it.key) + ' has ended.' : 'New chapter saved.'));
    t.appendChild(document.createTextNode(' ' + (it.kind === 'month' ? 'Write its summary?' : it.kind === 'quarter' ? 'Write the quarter chapter?' : 'Refresh "where things stand"?')));
    if (pend.length > 1) t.appendChild(el('span', 'small-muted', plural(pend.length - 1, 'more waiting after this', 'more waiting after this')));
    b.appendChild(t);
    const go = el('button', 'small', '✦ Draft it');
    go.addEventListener('click', () => openDraftSheet(it, { generate: true }));
    b.appendChild(go);
    box.appendChild(b);
  }

  // Draft / edit sheet. generate=true asks Claude first; the text is editable and only
  // saved when you press Save.
  function openDraftSheet(item, { generate }) {
    const back = el('div', 'sheet-back');
    back.id = 'draft-sheet';
    const sheet = el('div', 'sheet');
    const head = el('div', 'sheet-head');
    const title = el('div', 'sheet-title');
    title.appendChild(el('strong', '', itemTitle(item)));
    const status = el('span', '', '');
    title.appendChild(status);
    const x = el('button', 'icon-btn', '×');
    x.addEventListener('click', () => back.remove());
    head.appendChild(title);
    head.appendChild(x);
    const body = el('div', 'sheet-body');
    const ta = el('textarea', 'draft-ta');
    const cur = storedFor(item);
    ta.value = cur ? cur.text : '';
    body.appendChild(ta);
    const foot = el('div', 'imp-foot');
    const regen = el('button', '', '✦ Redraft');
    const cancel = el('button', '', 'Cancel');
    const saveB = el('button', '', 'Save');
    saveB.style.background = 'var(--accent)'; saveB.style.color = 'var(--bg)'; saveB.style.borderColor = 'var(--accent)';
    foot.appendChild(regen); foot.appendChild(cancel); foot.appendChild(saveB);
    sheet.appendChild(head); sheet.appendChild(body); sheet.appendChild(foot);
    back.appendChild(sheet);
    document.body.appendChild(back);
    requestAnimationFrame(() => autosize(ta));
    let usedModel = cur ? cur.model : null;

    const draft = async () => {
      regen.disabled = saveB.disabled = true;
      status.textContent = 'Claude is drafting… (about 20–60 s)';
      try {
        const pr = buildPrompt(item);
        ta.value = await callClaude(SUM_MODEL, pr.system, pr.user, item.kind === 'header' ? 1500 : 6000);
        usedModel = SUM_MODEL;
        status.textContent = 'Draft — read and edit, then Save';
      } catch (e) {
        console.error(e);
        status.textContent = 'Failed: ' + e.message;
      } finally {
        regen.disabled = saveB.disabled = false;
        autosize(ta);
      }
    };
    regen.addEventListener('click', draft);
    cancel.addEventListener('click', () => back.remove());
    saveB.addEventListener('click', async () => {
      const text = ta.value.trim();
      if (!text) return;
      const S = sums();
      const now = new Date().toISOString();
      const prev = storedFor(item);
      const rec = { text, created: prev ? prev.created : now, model: usedModel || undefined };
      if (prev) rec.edited = now;
      if (item.kind === 'month') S.months[item.key] = rec;
      else if (item.kind === 'quarter') S.quarters[item.key] = rec;
      else S.header = Object.assign(rec, { asof: item.key });
      Object.keys(rec).forEach(k => rec[k] === undefined && delete rec[k]);
      back.remove();
      render();
      await save();
      showToast(itemTitle(item) + ' saved');
    });
    if (generate) draft(); else status.textContent = cur ? 'Saved ' + fmtDate(cur.edited || cur.created) : '';
  }

  // Minimal, safe markdown for summaries: ## / ### headings, - bullets, **bold**, paragraphs.
  function mdBlock(text) {
    const root = el('div', 'story-text');
    let ul = null;
    const inline = (node, str) => str.split(/(\*\*[^*]+\*\*)/).forEach(part => {
      if (/^\*\*[^*]+\*\*$/.test(part)) node.appendChild(el('strong', '', part.slice(2, -2)));
      else if (part) node.appendChild(document.createTextNode(part));
    });
    text.split('\n').forEach(line => {
      const t = line.trim();
      if (!t) { ul = null; return; }
      let m;
      if ((m = t.match(/^#{1,2}\s+(.*)/))) { ul = null; const h = el('h4'); inline(h, m[1]); root.appendChild(h); }
      else if ((m = t.match(/^#{3,6}\s+(.*)/))) { ul = null; const h = el('h5'); inline(h, m[1]); root.appendChild(h); }
      else if ((m = t.match(/^[-*]\s+(.*)/))) { if (!ul) { ul = el('ul'); root.appendChild(ul); } const li = el('li'); inline(li, m[1]); ul.appendChild(li); }
      else { ul = null; const p = el('p'); inline(p, t); root.appendChild(p); }
    });
    return root;
  }

  // Story section in the sidebar: header, kept chapters, month summaries.
  let openStoryKey = null;
  function renderStory() {
    const S = sums();
    const box = document.getElementById('story');
    box.innerHTML = '';
    const chapters = Object.keys(S.quarters).sort().reverse();
    const months = Object.keys(S.months).sort().reverse();
    document.getElementById('story-sum').textContent = S.header ? 'as of ' + quarterLabel(S.header.asof) + ' · ' + plural(chapters.length + months.length, 'summary', 'summaries')
      : (months.length ? plural(months.length, 'month summary', 'month summaries') : 'no summaries yet');
    if (!S.header && !chapters.length && !months.length) {
      box.appendChild(el('p', 'muted', 'Monthly summaries appear here after each month ends.'));
      return;
    }
    if (S.header) {
      const c = el('div', 'story-card header');
      c.appendChild(mdBlock(S.header.text));
      const a = el('div', 'card-actions');
      a.appendChild(linkBtn('Edit', () => openDraftSheet({ kind: 'header', key: S.header.asof }, { generate: false })));
      a.appendChild(linkBtn('Redraft', () => openDraftSheet({ kind: 'header', key: S.header.asof }, { generate: true })));
      c.appendChild(a);
      box.appendChild(c);
    }
    const row = (item, label, rec) => {
      const k = item.kind + ':' + item.key;
      const r = el('button', 'story-row');
      r.type = 'button';
      r.appendChild(el('span', 'nm', label));
      r.appendChild(el('span', 'meta', (rec.edited ? 'edited ' : '') + fmtDate(rec.edited || rec.created)));
      r.addEventListener('click', () => { openStoryKey = openStoryKey === k ? null : k; renderStory(); });
      box.appendChild(r);
      if (openStoryKey === k) {
        const o = el('div', 'story-open');
        o.appendChild(mdBlock(rec.text));
        const a = el('div', 'card-actions');
        a.appendChild(linkBtn('Edit', () => openDraftSheet(item, { generate: false })));
        a.appendChild(linkBtn('Redraft', () => openDraftSheet(item, { generate: true })));
        o.appendChild(a);
        box.appendChild(o);
      }
    };
    if (chapters.length) box.appendChild(el('p', 'outcome-label', 'Quarter chapters'));
    chapters.forEach(k => row({ kind: 'quarter', key: k }, 'Chapter ' + quarterLabel(k), S.quarters[k]));
    if (months.length) box.appendChild(el('p', 'outcome-label', 'Month summaries'));
    months.forEach(k => row({ kind: 'month', key: k }, monthLabel(k), S.months[k]));
  }

  // Default export: the layered view as of today (story, chapters, this quarter's
  // month summaries, this month's raw notes).
  function exportLayered() {
    const sec = layeredSections(monthKey(new Date()));
    const rows = sec.map(x => x.layer === 'note'
      ? { layer: 'note', period: x.period, date: x.note.date, bets: entryBets(x.note).map(b => b.name).join(' + '), ai: x.note.ai ? 'yes' : '', text: x.note.text || '' }
      : { layer: x.layer, period: x.period, date: '', bets: '', ai: 'yes', text: x.text });
    downloadFile('big-picture-layered-' + dayKey(new Date()) + '.csv', toCsv(rows, ['layer', 'period', 'date', 'bets', 'ai', 'text']), 'text/csv;charset=utf-8;');
  }

  addEntryBtn.addEventListener('click', async () => {
    const text = logComposer.ta.value.trim();
    if (!text && !logComposer.state.atts.length) return;
    if (logComposer.isBusy()) { alert('Still processing images — try again in a second.'); return; }
    addEntryBtn.disabled = true;
    addEntryBtn.textContent = 'Saving…';
    try {
      const attachments = await logComposer.commit();
      const date = new Date().toISOString();
      const entry = { id: 'log_' + Date.now(), text, date, history: [{ v: 1, date, text }] };
      if (logComposer.state.ai) entry.ai = true;
      setEntryBets(entry, [...composeBets]);
      if (attachments.length) entry.attachments = attachments;
      data.log.push(entry);
      logComposer.reset();
      composeBets.clear();
      chipsOpen = false;
      hintMsg = null;
      renderComposeHint();
      render();
      await save();
    } catch (e) {
      console.error(e);
      alert('Saving images failed: ' + e.message);
    } finally {
      addEntryBtn.disabled = false;
      addEntryBtn.textContent = 'Add entry';
    }
  });

  // A picture dropped anywhere else on the page goes to the "Log today" box
  // instead of the browser navigating away to the image.
  window.addEventListener('dragover', (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault();
    if (appEl.style.display !== 'none') logComposer.addFiles(e.dataTransfer.files);
  });

  // ---------- version tag ----------
  function showVersion(dateStr) {
    document.getElementById('version').textContent = 'v' + APP_VERSION + ' · updated ' + fmtDate(dateStr);
  }
  showVersion(APP_UPDATED + 'T12:00:00');
  fetch('https://api.github.com/repos/allitob/big_picture/commits?path=index.html&per_page=1')
    .then(r => r.ok ? r.json() : null)
    .then(j => { const d = j && j[0] && j[0].commit && j[0].commit.committer.date; if (d) showVersion(d); })
    .catch(() => {});

  // ---------- export ----------
  function csvEscape(v) {
    const s = (v === null || v === undefined) ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function toCsv(rows, headers) {
    const lines = [headers.join(',')];
    rows.forEach(r => lines.push(headers.map(h => csvEscape(r[h])).join(',')));
    return lines.join('\r\n');
  }

  function downloadFile(filename, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Every version of every bet and log entry, plus status changes and deletions,
  // chronological — a full activity trail. New columns are appended at the end.
  function buildActivityRows() {
    const rows = [];
    data.bets.forEach(bet => {
      ensureHistory(bet, ['name', 'why']);
      bet.history.forEach(h => {
        rows.push({
          date: h.date, type: 'bet', action: h.v === 1 ? 'created' : 'edited',
          item_id: bet.id, version: h.v, bet_name: '', name: h.name, why: h.why || '', text: '', status: '', outcome: ''
        });
      });
      (bet.statusLog || []).forEach(s => {
        rows.push({
          date: s.date, type: 'bet', action: s.status === 'idea' ? 'planned' : s.status === 'active' ? (s.from === 'idea' ? 'started' : 'reopened') : 'closed',
          item_id: bet.id, version: '', bet_name: '', name: bet.name, why: '', text: '', status: s.status, outcome: s.outcome || ''
        });
      });
    });
    data.log.forEach(entry => {
      ensureHistory(entry, ['text']);
      const betNames = entryBets(entry).map(b => b.name).join(' + ');
      entry.history.forEach(h => {
        rows.push({
          date: h.date, type: 'log', action: h.v === 1 ? 'created' : 'edited',
          item_id: entry.id, version: h.v, bet_name: betNames, name: '', why: '', text: h.text, status: '', outcome: ''
        });
      });
      if (entry.deleted) {
        rows.push({
          date: entry.deleted, type: 'log', action: 'deleted',
          item_id: entry.id, version: '', bet_name: betNames, name: '', why: '', text: entry.text, status: '', outcome: ''
        });
      }
    });
    rows.sort((a, b) => new Date(a.date) - new Date(b.date));
    return rows;
  }

  // Every bet and log entry grouped with all of its own versions.
  function buildVersionsRows() {
    const rows = [];
    data.bets.forEach(bet => {
      ensureHistory(bet, ['name', 'why']);
      const currentV = bet.history.length;
      bet.history.forEach(h => {
        rows.push({
          item_type: 'bet', item_id: bet.id, version: h.v, is_current: h.v === currentV ? 'yes' : 'no',
          date: h.date, name: h.name, why: h.why || '', text: '', bet_id: '', bet_name: '',
          status: betStatus(bet), closed: bet.closed || '', outcome: bet.outcome || '', deleted: '', attachments: ''
        });
      });
    });
    data.log.forEach(entry => {
      ensureHistory(entry, ['text']);
      const betNames = entryBets(entry).map(b => b.name).join(' + ');
      const nAtt = (entry.attachments || []).length;
      const currentV = entry.history.length;
      entry.history.forEach(h => {
        rows.push({
          item_type: 'log', item_id: entry.id, version: h.v, is_current: h.v === currentV ? 'yes' : 'no',
          date: h.date, name: '', why: '', text: h.text, bet_id: entryBetIds(entry).join(';'), bet_name: betNames,
          status: '', closed: '', outcome: '', deleted: entry.deleted || '', attachments: nAtt, ai: entry.ai ? 'yes' : ''
        });
      });
    });
    rows.sort((a, b) => {
      if (a.item_type !== b.item_type) return a.item_type.localeCompare(b.item_type);
      if (a.item_id !== b.item_id) return a.item_id.localeCompare(b.item_id);
      return a.version - b.version;
    });
    return rows;
  }

  document.getElementById('export-activity-btn').addEventListener('click', () => {
    const headers = ['date', 'type', 'action', 'item_id', 'version', 'bet_name', 'name', 'why', 'text', 'status', 'outcome'];
    downloadFile('big-picture-activity.csv', toCsv(buildActivityRows(), headers), 'text/csv;charset=utf-8;');
  });

  document.getElementById('export-versions-btn').addEventListener('click', () => {
    const headers = ['item_type', 'item_id', 'version', 'is_current', 'date', 'name', 'why', 'text', 'bet_id', 'bet_name', 'status', 'closed', 'outcome', 'deleted', 'attachments', 'ai'];
    downloadFile('big-picture-versions.csv', toCsv(buildVersionsRows(), headers), 'text/csv;charset=utf-8;');
  });
</script>
</body>
