<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Big Picture</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Big Picture" />
<meta name="theme-color" content="#185fa5" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png" />
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f4f0;
    --text: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #e2e0d8;
    --warning-bg: #faeeda;
    --warning-text: #854f0b;
    --danger-text: #a32d2d;
    --accent: #185fa5;
    --accent-soft: #dde9f5;
    --done-text: #2f6b2a;
    --done-bg: #e3efdf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --surface: #2c2c2a;
      --text: #f1efe8;
      --text-secondary: #b4b2a9;
      --text-muted: #888780;
      --border: #444441;
      --warning-bg: #412402;
      --warning-text: #fac775;
      --danger-text: #f09595;
      --accent: #85b7eb;
      --accent-soft: #23384d;
      --done-text: #a8d69f;
      --done-bg: #24361f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 1.5rem; }
  h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .section { margin-bottom: 2rem; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 0.75rem; }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button:active { opacity: 0.7; }
  button.small { font-size: 13px; padding: 5px 10px; }
  input, textarea, select {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    margin-bottom: 8px;
  }
  textarea { min-height: 70px; resize: none; overflow: hidden; }
  .card {
    background: var(--surface);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    margin-bottom: 8px;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card p { margin: 0; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
  .link-btn { font-size: 12px; color: var(--accent); text-decoration: none; cursor: pointer; background: none; border: none; padding: 0; }
  .link-btn.danger { color: var(--danger-text); }
  .history-panel { margin-top: 6px; padding: 4px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); }
  .history-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); padding: 4px 0; cursor: pointer; }
  .history-content { padding: 0 0 8px; border-top: 1px dashed var(--border); margin-top: -2px; }
  .history-content p { margin: 6px 0 0 !important; }
  .stale-flag { display: inline-block; font-size: 11px; color: var(--warning-text); background: var(--warning-bg); padding: 2px 6px; border-radius: 6px; margin-top: 4px; }
  .bet-name { font-weight: 600; font-size: 15px; margin-bottom: 2px !important; }
  .bet-why { font-size: 13px; color: var(--text-secondary); white-space: pre-wrap; }
  .badge { font-size: 12px; white-space: nowrap; color: var(--text-muted); }
  .muted { color: var(--text-muted); font-size: 14px; }
  .small-muted { color: var(--text-muted); font-size: 12px; }
  .log-entry { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 8px; }
  .log-date { font-size: 12px; color: var(--text-muted); margin: 0 0 2px !important; }
  .log-text { font-size: 14px; white-space: pre-wrap; margin: 0; }
  .form-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1.5rem;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .nudge {
    background: var(--warning-bg);
    color: var(--warning-text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 1.5rem;
    display: none;
  }
  .divider { border-top: 1px solid var(--border); padding-top: 1.5rem; }
  .status { font-size: 13px; color: var(--text-muted); text-align: center; padding: 2rem 0; }

  /* v2: lifecycle */
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; vertical-align: 1px; margin-left: 6px; }
  .pill.done { color: var(--done-text); background: var(--done-bg); }
  .pill.dropped { color: var(--text-secondary); background: var(--border); }
  .closed-card { background: transparent; border: 1px solid var(--border); }
  .outcome { font-size: 13px; white-space: pre-wrap; margin-top: 4px !important; }
  .outcome-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-top: 8px !important; }
  .close-form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .seg button { border: none; border-radius: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: var(--bg); }
  .toggle-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }

  /* v2: review */
  .review-card { background: var(--surface); border-radius: 12px; padding: 1rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .stat .n { font-size: 20px; font-weight: 600; line-height: 1.2; }
  .stat .l { font-size: 11px; color: var(--text-muted); }
  .dots { display: flex; gap: 4px; margin-top: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .dot.on { background: var(--accent); }
  .bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 8px; align-items: center; margin-bottom: 6px; }
  .bar-label { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 6px; border-radius: 3px; background: var(--bg); margin-top: 2px; }
  .bar-fill { height: 6px; border-radius: 3px; background: var(--accent); }
  .bar-n { font-size: 12px; color: var(--text-muted); text-align: right; }
  .untouched { font-size: 13px; color: var(--warning-text); margin-top: 8px !important; }

  /* v2: log */
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .filters select, .filters input { margin-bottom: 0; font-size: 14px; padding: 8px 10px; }
  .week-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .week-head:first-child { margin-top: 12px; }
  .copied { font-size: 12px; color: var(--done-text); margin-left: 8px; }

  /* v2.1: header, bet chips, attachments */
  .title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 1.5rem; }
  .title-row h1 { margin: 0; }
  .version { font-size: 12px; color: var(--text-muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
  .chip-hint { font-size: 12px; color: var(--text-muted); align-self: center; }
  .composer.dragging textarea { border-color: var(--accent); border-style: dashed; }
  .att-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .att { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); cursor: pointer; padding: 0; flex: none; }
  .att img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.65); color: #fff; font-size: 13px; line-height: 20px; text-align: center; }
  .att .ph { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); }
  .compose-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* v2.2: calendar, day card, toast */
  :root { --heat-0: #ebe9e2; --heat-1: #9be9a8; --heat-2: #40c463; --heat-3: #30a14e; --heat-4: #216e39; }
  @media (prefers-color-scheme: dark) {
    :root { --heat-0: #333331; --heat-1: #0e4429; --heat-2: #006d32; --heat-3: #26a641; --heat-4: #39d353; }
  }
  .heat { display: flex; gap: 6px; margin-top: 12px; }
  .heat-days { display: grid; grid-template-rows: 14px repeat(7, 13px); row-gap: 3px; font-size: 10px; color: var(--text-muted); flex: none; }
  .heat-days span { line-height: 13px; }
  .heat-scroll { overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: thin; }
  .heat-inner { position: relative; display: inline-block; padding-top: 17px; padding-right: 14px; }
  .heat-months { position: absolute; top: 0; left: 0; height: 14px; font-size: 10px; color: var(--text-muted); white-space: nowrap; }
  .heat-months span { position: absolute; }
  .heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); grid-auto-columns: 13px; gap: 3px; }
  .cell { width: 13px; height: 13px; border-radius: 3px; background: var(--heat-0); border: none; padding: 0; }
  .cell.l1 { background: var(--heat-1); } .cell.l2 { background: var(--heat-2); }
  .cell.l3 { background: var(--heat-3); } .cell.l4 { background: var(--heat-4); }
  .cell.has { cursor: pointer; }
  .cell.future { background: transparent; }
  .cell.today { outline: 1.5px solid var(--text-secondary); outline-offset: 1px; }
  .cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cell.dim { opacity: 0.2; }
  .heat-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
  .legend { display: flex; align-items: center; gap: 3px; }
  .legend .cell { width: 10px; height: 10px; border-radius: 2px; }
  .log-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .log-head .seg { margin-bottom: 0; }
  .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 82vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; box-shadow: 0 -4px 24px rgba(0,0,0,0.2); }
  @media (min-width: 640px) { .sheet-back { align-items: center; } .sheet { border-radius: 16px; max-height: 80vh; } }
  .sheet-head { display: flex; align-items: center; gap: 6px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--border); }
  .sheet-title { flex: 1; min-width: 0; }
  .sheet-title strong { display: block; font-size: 15px; }
  .sheet-title span { font-size: 12px; color: var(--text-muted); }
  .icon-btn { width: 34px; height: 34px; padding: 0; font-size: 16px; line-height: 1; flex: none; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .sheet-body { overflow-y: auto; padding: 12px 16px 24px; -webkit-overflow-scrolling: touch; }
  .sheet-body .log-entry:last-child { border-bottom: none; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; display: flex; gap: 14px; align-items: center; z-index: 60; box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  .toast a { color: var(--accent-soft); font-weight: 600; cursor: pointer; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row"><h1>Big picture</h1><span id="version" class="version"></span></div>
  <div id="status" class="status">Connecting…</div>

  <form id="setup" class="form-card" style="display:none;" autocomplete="on">
    <p class="muted" style="margin-top:0;">Enter your sync ID to connect this device to your data. (Find it in your other device's settings, or pick a new private string if this is your first device.) Your browser can offer to save this like a password.</p>
    <input id="setup-label" name="username" value="big-picture" autocomplete="username" style="position:absolute; left:-9999px;" tabindex="-1" aria-hidden="true" />
    <input id="setup-doc-id" name="password" type="password" placeholder="Sync ID" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <button type="submit" id="setup-save-btn">Connect</button>
  </form>

  <div id="app" style="display:none;">
    <div id="nudge" class="nudge"></div>

    <div class="section">
      <div class="row">
        <h2>Bets</h2>
        <button id="add-bet-btn">+ Add bet</button>
      </div>
      <div id="add-bet-form" class="form-card" style="display:none;">
        <input id="bet-name" placeholder="Name (e.g. Payload gantry)" />
        <textarea id="bet-why" placeholder="Why it matters, in a sentence"></textarea>
        <div class="btn-row">
          <button id="save-bet-btn">Save bet</button>
          <button id="cancel-bet-btn">Cancel</button>
        </div>
      </div>
      <div id="bets-list"></div>
      <div id="closed-bets"></div>
    </div>

    <div class="section divider">
      <h2 style="margin-bottom:0.75rem;">Log today</h2>
      <div id="log-bet-chips" class="chips"></div>
      <div id="log-composer" class="composer"></div>
    </div>

    <div class="section divider">
      <div class="row">
        <h2>Review</h2>
        <div>
          <span id="copied-flag" class="copied" style="display:none;">Copied</span>
          <button id="copy-review-btn" class="small">Copy for review</button>
        </div>
      </div>
      <div class="seg" id="review-range"></div>
      <div id="review"></div>
    </div>

    <div class="section divider">
      <div class="log-head">
        <h2>Log</h2>
        <div class="seg" id="log-view"></div>
      </div>
      <div class="filters">
        <select id="filter-bet"></select>
        <input id="filter-text" type="search" placeholder="Search" autocapitalize="off" />
      </div>
      <div id="heatmap"></div>
      <div id="log-list"></div>
      <div id="log-more" style="text-align:center; display:none;">
        <button id="log-more-btn" class="small">Show older</button>
      </div>
      <div id="deleted-box"></div>
    </div>

    <div class="section divider">
      <h2 style="margin-bottom:0.75rem;">Export</h2>
      <div class="btn-row">
        <button id="export-activity-btn">Activity log (.csv)</button>
        <button id="export-versions-btn">Versions table (.csv)</button>
      </div>
    </div>

    <p class="muted" style="text-align:center;"><a id="change-sync-id" href="#" style="color:inherit;">change sync ID</a></p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ---- PASTE YOUR FIREBASE CONFIG HERE ----
  const firebaseConfig = {
    apiKey: "AIzaSyB_4N7Z2a_qQwaL-aY-47WDAXZeqS8fRUI",
    authDomain: "big-picture-8bd64.firebaseapp.com",
    projectId: "big-picture-8bd64",
    storageBucket: "big-picture-8bd64.firebasestorage.app",
    messagingSenderId: "286061786704",
    appId: "1:286061786704:web:d0b8196cbb701c32920355"
  };
  // ------------------------------------------

  // Bump APP_VERSION and APP_UPDATED when shipping a change. The date is
  // refreshed from GitHub's last commit to index.html when reachable.
  const APP_VERSION = '2.2';
  const APP_UPDATED = '2026-11-07';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Data model (all v2 fields optional, so v1 documents load unchanged):
  //   bet:   { id, name, why, created, history[{v,date,name,why}],
  //            status: 'active'|'done'|'dropped', closed, outcome,
  //            statusLog[{date, status, outcome}] }
  //   entry: { id, text, betIds[], betId (= betIds[0], for v1 readers), date,
  //            history[{v,date,text}], deleted, attachments[{id, w, h}] }
  //   images: separate docs bigpicture/<syncId>__img_<id> and __thm_<id>
  //           ({ data: dataURL, w, h, created }) so the main doc stays far below
  //           Firestore's 1 MB limit. Same collection, so the existing rules apply.
  let data = { bets: [], log: [] };
  let docRef = null;
  let syncId = null;
  let authReady = false;

  // UI state
  let editingBetId = null;
  let closingBetId = null;
  let closingStatus = 'done';
  let expandedBetHistory = null;
  let editingLogId = null;
  let expandedLogHistory = null;
  let expandedVersionKey = null;
  let expandedTexts = new Set();
  let showClosed = false;
  let reviewRange = 'week';
  let logLimit = 20;
  let filterBet = 'all';
  let filterText = '';
  let logView = 'calendar';     // 'calendar' | 'list'; a search always shows matching notes as a list
  let openDay = null;           // 'YYYY-MM-DD' of the day card, or null
  let heatScrolledToEnd = false;
  let showDeleted = false;

  const WHY_LIMIT = 160;
  const LOG_LIMIT = 240;
  const LOG_PAGE = 20;
  const RANGES = [
    { key: 'week', label: 'This week' },
    { key: 'last', label: 'Last week' },
    { key: '4w', label: '4 weeks' },
    { key: 'all', label: 'All' },
  ];

  const statusEl = document.getElementById('status');
  const appEl = document.getElementById('app');
  const setupEl = document.getElementById('setup');
  const setupInput = document.getElementById('setup-doc-id');

  // The sync ID is never stored in source (this repo is public) — each device
  // stores its own copy in localStorage after you enter it once. It's just a
  // private string that names your document in Firestore; Firestore rules only
  // require an authenticated (anonymous) session, so keeping this ID out of the
  // public repo is what actually keeps your data private.
  const DOC_ID_KEY = 'bp-doc-id';

  onAuthStateChanged(auth, (user) => {
    if (!user) return;
    authReady = true;
    tryConnect();
  });

  signInAnonymously(auth).catch((err) => {
    statusEl.textContent = "Couldn't connect: " + err.message;
  });

  function tryConnect() {
    if (!authReady) return;
    const savedId = localStorage.getItem(DOC_ID_KEY);
    if (!savedId) {
      statusEl.style.display = 'none';
      setupEl.style.display = 'block';
      setupInput.focus();
      return;
    }
    setupEl.style.display = 'none';
    connect(savedId);
  }

  async function connect(docId) {
    syncId = docId;
    docRef = doc(db, "bigpicture", docId);
    statusEl.style.display = 'block';
    statusEl.textContent = 'Connecting…';
    await load();
    statusEl.style.display = 'none';
    appEl.style.display = 'block';
  }

  setupEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = setupInput.value.trim();
    if (!id) return;
    localStorage.setItem(DOC_ID_KEY, id);
    setupEl.style.display = 'none';
    connect(id);
  });

  document.getElementById('change-sync-id').addEventListener('click', (e) => {
    e.preventDefault();
    appEl.style.display = 'none';
    setupInput.value = localStorage.getItem(DOC_ID_KEY) || '';
    setupEl.style.display = 'block';
    setupInput.focus();
  });

  // ---------- dates ----------
  function fmtDate(d) {
    return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function fmtDay(d) {
    return new Date(d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function daysSince(d) {
    return Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
  }
  // Monday 00:00 local of the week containing d.
  function weekStart(d) {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function addDays(d, n) {
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }
  function isoWeek(d) {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() + 3 - ((x.getDay() + 6) % 7));
    const jan4 = new Date(x.getFullYear(), 0, 4);
    return 1 + Math.round(((x - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  }
  function weekLabel(start) {
    const end = addDays(start, 6);
    return 'Week ' + isoWeek(start) + ' · ' + fmtDate(start) + '–' + fmtDate(end);
  }
  function weeksBetween(a, b) {
    return Math.max(1, Math.round((new Date(b) - new Date(a)) / (7 * 86400000)));
  }

  // ---------- model helpers ----------
  // Lazily synthesizes a v1 history entry for items saved before versioning existed.
  function ensureHistory(item, fields) {
    if (!item.history || !item.history.length) {
      const first = { v: 1, date: item.created || item.date || new Date().toISOString() };
      fields.forEach(f => { first[f] = item[f]; });
      item.history = [first];
    }
    return item.history;
  }
  function betStatus(bet) { return bet.status || 'active'; }
  function isActive(bet) { return betStatus(bet) === 'active'; }
  function liveLog() { return data.log.filter(l => !l.deleted); }
  function entryBetIds(e) { return e.betIds || (e.betId ? [e.betId] : []); }
  function entryBets(e) { return entryBetIds(e).map(id => data.bets.find(b => b.id === id)).filter(Boolean); }
  function setEntryBets(e, ids) { e.betIds = ids; e.betId = ids[0] || null; }
  function entriesFor(betId) { return liveLog().filter(l => entryBetIds(l).includes(betId)); }

  // Which version of a bet was current as of a given date (used to flag log
  // entries logged against a bet that has since been edited).
  function betVersionAtDate(bet, dateStr) {
    const t = new Date(dateStr).getTime();
    let v = bet.history[0].v;
    bet.history.forEach(h => {
      if (new Date(h.date).getTime() <= t) v = h.v;
    });
    return v;
  }

  function lastTouch(betId) {
    const entries = entriesFor(betId);
    if (!entries.length) return null;
    return entries.reduce((a, b) => new Date(a.date) > new Date(b.date) ? a : b).date;
  }

  function rangeBounds(key) {
    const ws = weekStart(new Date());
    if (key === 'week') return { from: ws, to: addDays(ws, 7), label: weekLabel(ws) };
    if (key === 'last') { const s = addDays(ws, -7); return { from: s, to: ws, label: weekLabel(s) }; }
    if (key === '4w') { const s = addDays(ws, -21); return { from: s, to: addDays(ws, 7), label: fmtDate(s) + '–' + fmtDate(addDays(ws, 6)) }; }
    return { from: new Date(0), to: new Date(8.64e15), label: 'All time' };
  }
  function inRange(dateStr, r) {
    const t = new Date(dateStr);
    return t >= r.from && t < r.to;
  }

  // ---------- shared renderers ----------
  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function linkBtn(text, onClick, extraClass) {
    const a = el('a', 'link-btn' + (extraClass ? ' ' + extraClass : ''), text);
    a.href = '#';
    a.addEventListener('click', (e) => { e.preventDefault(); onClick(); });
    return a;
  }

  // Renders text with a "Show more…" / "Show less" toggle when it exceeds
  // `limit`. `key` must be unique among everything sharing expandedTexts.
  function appendExpandableText(container, key, fullText, limit, className) {
    const p = el('p', className);
    const isLong = fullText.length > limit;
    const isExpanded = expandedTexts.has(key);
    if (isLong && !isExpanded) {
      p.textContent = fullText.slice(0, limit).trimEnd() + '… ';
      p.appendChild(linkBtn('Show more…', () => { expandedTexts.add(key); render(); }));
    } else {
      p.textContent = fullText;
      if (isLong) {
        p.appendChild(document.createTextNode(' '));
        p.appendChild(linkBtn('Show less', () => { expandedTexts.delete(key); render(); }));
      }
    }
    container.appendChild(p);
  }

  function appendHistoryPanel(container, history, keyPrefix, renderContent) {
    const panel = el('div', 'history-panel');
    [...history].reverse().forEach(h => {
      const key = keyPrefix + '-v' + h.v;
      const rowWrap = el('div');
      const row = el('div', 'history-row');
      row.appendChild(el('span', '', 'v' + h.v));
      row.appendChild(el('span', '', fmtDate(h.date)));
      row.addEventListener('click', () => {
        expandedVersionKey = expandedVersionKey === key ? null : key;
        render();
      });
      rowWrap.appendChild(row);
      if (expandedVersionKey === key) {
        const content = el('div', 'history-content');
        renderContent(content, h);
        rowWrap.appendChild(content);
      }
      panel.appendChild(rowWrap);
    });
    container.appendChild(panel);
  }

  function betHistoryPanel(wrapper, bet) {
    appendHistoryPanel(wrapper, bet.history, 'bet-' + bet.id, (content, h) => {
      const nameP = el('p', 'bet-name', h.name);
      nameP.style.fontSize = '13px';
      content.appendChild(nameP);
      appendExpandableText(content, 'histv-bet-' + bet.id + '-v' + h.v, h.why || '', WHY_LIMIT, 'bet-why');
    });
  }

  // ---------- persistence ----------
  async function load() {
    try {
      const snap = await getDoc(docRef);
      if (snap.exists()) data = snap.data();
    } catch (e) {
      console.error('load failed', e);
    }
    data.bets = data.bets || [];
    data.log = data.log || [];
    render();
  }

  async function save() {
    try {
      await setDoc(docRef, data);
    } catch (e) {
      console.error('save failed', e);
      alert('Save failed: ' + e.message);
    }
  }

  // ---------- render ----------
  function render() {
    renderNudge();
    renderBets();
    renderClosedBets();
    renderLogSelect();
    renderReview();
    renderLog();
    renderDaySheet();
    requestAnimationFrame(() => document.querySelectorAll('#app textarea').forEach(autosize));
  }

  function renderNudge() {
    const nudge = document.getElementById('nudge');
    const log = liveLog();
    if (!log.length) { nudge.style.display = 'none'; return; }
    const lastEntry = [...log].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
    const ds = daysSince(lastEntry.date);
    if (ds >= 2) {
      nudge.style.display = 'block';
      nudge.textContent = ds + ' days since your last log entry. Quick check-in?';
    } else {
      nudge.style.display = 'none';
    }
  }

  function renderBets() {
    const betsList = document.getElementById('bets-list');
    betsList.innerHTML = '';
    const active = data.bets.filter(isActive);
    if (!active.length) {
      betsList.appendChild(el('p', 'muted', data.bets.length
        ? 'No active bets. Add the next big thing you are investing in.'
        : 'No bets yet. Add the big things you are actually investing in.'));
    }
    active.forEach(bet => {
      ensureHistory(bet, ['name', 'why']);
      const wrapper = el('div', 'card');

      if (editingBetId === bet.id) {
        renderBetEditor(wrapper, bet);
        betsList.appendChild(wrapper);
        return;
      }

      const lt = lastTouch(bet.id);
      const ds = lt ? daysSince(lt) : null;
      let badgeText = 'Not logged yet';
      let badgeColor = 'var(--text-muted)';
      if (ds !== null) {
        badgeText = ds === 0 ? 'Touched today' : ds === 1 ? 'Touched yesterday' : 'Touched ' + ds + ' days ago';
        if (ds >= 14) badgeColor = 'var(--danger-text)';
        else if (ds >= 7) badgeColor = 'var(--warning-text)';
        else badgeColor = 'var(--text-secondary)';
      }
      const row = el('div', 'card-row');
      const leftDiv = el('div');
      leftDiv.style.minWidth = '0';
      leftDiv.appendChild(el('p', 'bet-name', bet.name));
      appendExpandableText(leftDiv, bet.id, bet.why || '', WHY_LIMIT, 'bet-why');
      row.appendChild(leftDiv);
      const badge = el('span', 'badge', badgeText);
      badge.style.color = badgeColor;
      row.appendChild(badge);
      wrapper.appendChild(row);

      const n = entriesFor(bet.id).length;
      const actions = el('div', 'card-actions');
      actions.appendChild(linkBtn('Edit', () => { editingBetId = bet.id; render(); }));
      if (n) actions.appendChild(linkBtn('Log (' + n + ')', () => { filterBet = bet.id; logLimit = LOG_PAGE; render(); scrollToLog(); }));
      if (bet.history.length > 1) {
        actions.appendChild(linkBtn(expandedBetHistory === bet.id ? 'Hide history' : 'History (v' + bet.history.length + ')', () => {
          expandedBetHistory = expandedBetHistory === bet.id ? null : bet.id;
          render();
        }));
      }
      actions.appendChild(linkBtn(closingBetId === bet.id ? 'Cancel close' : 'Close bet', () => {
        closingBetId = closingBetId === bet.id ? null : bet.id;
        closingStatus = 'done';
        render();
      }));
      wrapper.appendChild(actions);

      if (expandedBetHistory === bet.id) betHistoryPanel(wrapper, bet);
      if (closingBetId === bet.id) renderCloseForm(wrapper, bet);

      betsList.appendChild(wrapper);
    });
  }

  function renderBetEditor(wrapper, bet) {
    const nameInput = el('input');
    nameInput.value = bet.name;
    nameInput.placeholder = 'Name';
    const whyInput = el('textarea');
    whyInput.value = bet.why || '';
    whyInput.placeholder = 'Why it matters';
    const btnRow = el('div', 'btn-row');
    const saveBtn = el('button', '', 'Save');
    const cancelBtn = el('button', '', 'Cancel');
    btnRow.appendChild(saveBtn);
    btnRow.appendChild(cancelBtn);
    wrapper.appendChild(nameInput);
    wrapper.appendChild(whyInput);
    wrapper.appendChild(btnRow);

    saveBtn.addEventListener('click', async () => {
      const newName = nameInput.value.trim();
      const newWhy = whyInput.value.trim();
      if (!newName) return;
      const changed = newName !== bet.name || newWhy !== (bet.why || '');
      bet.name = newName;
      bet.why = newWhy;
      if (changed) {
        bet.history.push({ v: bet.history.length + 1, date: new Date().toISOString(), name: newName, why: newWhy });
      }
      editingBetId = null;
      render();
      await save();
    });
    cancelBtn.addEventListener('click', () => { editingBetId = null; render(); });
  }

  function renderCloseForm(wrapper, bet) {
    const form = el('div', 'close-form');
    const seg = el('div', 'seg');
    [['done', 'Done'], ['dropped', 'Dropped']].forEach(([key, label]) => {
      const b = el('button', closingStatus === key ? 'on' : '', label);
      b.addEventListener('click', () => {
        closingStatus = key;
        form.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
        outcome.placeholder = key === 'done'
          ? 'Outcome — what shipped, what changed, what you learned'
          : 'Why you dropped it — what you learned';
      });
      seg.appendChild(b);
    });
    const outcome = el('textarea');
    outcome.placeholder = closingStatus === 'done'
      ? 'Outcome — what shipped, what changed, what you learned'
      : 'Why you dropped it — what you learned';
    const confirmBtn = el('button', '', 'Close bet');
    confirmBtn.addEventListener('click', async () => {
      const now = new Date().toISOString();
      const text = outcome.value.trim();
      bet.status = closingStatus;
      bet.closed = now;
      bet.outcome = text;
      bet.statusLog = bet.statusLog || [];
      bet.statusLog.push({ date: now, status: closingStatus, outcome: text });
      closingBetId = null;
      render();
      await save();
    });
    form.appendChild(seg);
    form.appendChild(outcome);
    form.appendChild(confirmBtn);
    wrapper.appendChild(form);
    setTimeout(() => outcome.focus(), 0);
  }

  function renderClosedBets() {
    const box = document.getElementById('closed-bets');
    box.innerHTML = '';
    const closed = data.bets.filter(b => !isActive(b))
      .sort((a, b) => new Date(b.closed || 0) - new Date(a.closed || 0));
    if (!closed.length) return;

    const head = el('div', 'toggle-head');
    head.style.margin = '14px 0 8px';
    head.appendChild(el('span', 'muted', 'Closed bets (' + closed.length + ')'));
    head.appendChild(el('span', 'link-btn', showClosed ? 'Hide' : 'Show'));
    head.addEventListener('click', () => { showClosed = !showClosed; render(); });
    box.appendChild(head);
    if (!showClosed) return;

    closed.forEach(bet => {
      ensureHistory(bet, ['name', 'why']);
      const st = betStatus(bet);
      const wrapper = el('div', 'card closed-card');
      const nameP = el('p', 'bet-name', bet.name);
      nameP.appendChild(el('span', 'pill ' + st, st === 'done' ? 'Done' : 'Dropped'));
      wrapper.appendChild(nameP);

      const n = entriesFor(bet.id).length;
      const start = bet.created || bet.history[0].date;
      const meta = 'Closed ' + fmtDate(bet.closed) + ' · ran ' + weeksBetween(start, bet.closed) + ' wk · ' + n + (n === 1 ? ' entry' : ' entries');
      wrapper.appendChild(el('p', 'small-muted', meta));
      appendExpandableText(wrapper, 'closed-why-' + bet.id, bet.why || '', WHY_LIMIT, 'bet-why');
      if (bet.outcome) {
        wrapper.appendChild(el('p', 'outcome-label', 'Outcome'));
        appendExpandableText(wrapper, 'outcome-' + bet.id, bet.outcome, WHY_LIMIT, 'outcome');
      }

      const actions = el('div', 'card-actions');
      if (n) actions.appendChild(linkBtn('Log (' + n + ')', () => { filterBet = bet.id; logLimit = LOG_PAGE; render(); scrollToLog(); }));
      if (bet.history.length > 1) {
        actions.appendChild(linkBtn(expandedBetHistory === bet.id ? 'Hide history' : 'History (v' + bet.history.length + ')', () => {
          expandedBetHistory = expandedBetHistory === bet.id ? null : bet.id;
          render();
        }));
      }
      actions.appendChild(linkBtn('Reopen', async () => {
        const now = new Date().toISOString();
        bet.status = 'active';
        bet.statusLog = bet.statusLog || [];
        bet.statusLog.push({ date: now, status: 'active', outcome: '' });
        delete bet.closed;
        // outcome is kept in statusLog; clear the live field so a re-close starts fresh
        bet.outcome = '';
        render();
        await save();
      }));
      wrapper.appendChild(actions);
      if (expandedBetHistory === bet.id) betHistoryPanel(wrapper, bet);
      box.appendChild(wrapper);
    });
  }

  function betOptions(select, { includeClosed, selected, extra }) {
    select.innerHTML = '';
    (extra || []).forEach(([v, label]) => {
      const o = el('option', '', label);
      o.value = v;
      select.appendChild(o);
    });
    const active = data.bets.filter(isActive);
    const closed = data.bets.filter(b => !isActive(b));
    const addGroup = (label, bets) => {
      if (!bets.length) return;
      const g = document.createElement('optgroup');
      g.label = label;
      bets.forEach(b => {
        const o = el('option', '', b.name);
        o.value = b.id;
        g.appendChild(o);
      });
      select.appendChild(g);
    };
    if (includeClosed) {
      addGroup('Active', active);
      addGroup('Closed', closed);
    } else {
      active.forEach(b => {
        const o = el('option', '', b.name);
        o.value = b.id;
        select.appendChild(o);
      });
    }
    select.value = selected;
    if (select.value !== selected) select.value = (extra && extra[0]) ? extra[0][0] : '';
  }

  // Toggleable bet chips. Shows active bets, plus any closed bet already in `selected`.
  function renderBetChips(container, selected) {
    container.innerHTML = '';
    const bets = data.bets.filter(b => isActive(b) || selected.has(b.id));
    bets.forEach(b => {
      const c = el('button', 'chip' + (selected.has(b.id) ? ' on' : ''), b.name);
      c.type = 'button';
      c.title = b.name;
      c.addEventListener('click', () => {
        if (selected.has(b.id)) selected.delete(b.id); else selected.add(b.id);
        c.classList.toggle('on', selected.has(b.id));
        hint.style.display = selected.size ? 'none' : '';
      });
      container.appendChild(c);
    });
    const hint = el('span', 'chip-hint', bets.length ? 'None = general note' : 'General note (no active bets)');
    hint.style.display = selected.size ? 'none' : '';
    container.appendChild(hint);
  }

  const composeBets = new Set();
  function renderLogSelect() {
    [...composeBets].forEach(id => { const b = data.bets.find(x => x.id === id); if (!b || !isActive(b)) composeBets.delete(id); });
    renderBetChips(document.getElementById('log-bet-chips'), composeBets);
  }

  // ---------- review ----------
  function renderReview() {
    const seg = document.getElementById('review-range');
    seg.innerHTML = '';
    RANGES.forEach(r => {
      const b = el('button', reviewRange === r.key ? 'on' : '', r.label);
      b.addEventListener('click', () => { reviewRange = r.key; render(); });
      seg.appendChild(b);
    });

    const box = document.getElementById('review');
    box.innerHTML = '';
    const r = rangeBounds(reviewRange);
    const entries = liveLog().filter(l => inRange(l.date, r));
    const card = el('div', 'review-card');
    card.appendChild(el('p', 'small-muted', r.label));
    card.lastChild.style.margin = '0 0 10px';

    // Stats
    const stats = el('div', 'stats');
    const stat = (n, l) => {
      const s = el('div', 'stat');
      s.appendChild(el('div', 'n', String(n)));
      s.appendChild(el('div', 'l', l));
      stats.appendChild(s);
      return s;
    };
    stat(entries.length, entries.length === 1 ? 'entry' : 'entries');
    const days = new Set(entries.map(e => new Date(e.date).toDateString()));
    if (reviewRange === 'week' || reviewRange === 'last') {
      const s = stat(countWorkdays(days, r.from) + '/5', 'workdays logged');
      const dots = el('div', 'dots');
      for (let i = 0; i < 5; i++) {
        dots.appendChild(el('span', 'dot' + (days.has(addDays(r.from, i).toDateString()) ? ' on' : '')));
      }
      s.appendChild(dots);
    } else {
      stat(days.size, days.size === 1 ? 'day logged' : 'days logged');
    }
    const closedInRange = data.bets.filter(b => !isActive(b) && b.closed && inRange(b.closed, r));
    stat(closedInRange.length, closedInRange.length === 1 ? 'bet closed' : 'bets closed');
    card.appendChild(stats);

    // Attention split
    const counts = new Map();
    entries.forEach(e => {
      const ids = entryBets(e).map(b => b.id);
      (ids.length ? ids : ['']).forEach(id => counts.set(id, (counts.get(id) || 0) + 1));
    });
    const rows = [...counts.entries()].map(([id, n]) => {
      const bet = data.bets.find(b => b.id === id);
      return { id, n, name: bet ? bet.name : 'General notes', general: !bet };
    }).sort((a, b) => (a.general - b.general) || (b.n - a.n));
    const max = Math.max(1, ...rows.map(x => x.n));
    if (rows.length) {
      card.appendChild(el('p', 'outcome-label', 'Where attention went'));
      card.lastChild.style.margin = '0 0 6px';
      rows.forEach(x => {
        const row = el('div', 'bar-row');
        const left = el('div');
        left.appendChild(el('div', 'bar-label', x.name));
        const track = el('div', 'bar-track');
        const fill = el('div', 'bar-fill');
        fill.style.width = (100 * x.n / max) + '%';
        if (x.general) fill.style.background = 'var(--text-muted)';
        track.appendChild(fill);
        left.appendChild(track);
        row.appendChild(left);
        row.appendChild(el('div', 'bar-n', String(x.n)));
        card.appendChild(row);
      });
    } else {
      card.appendChild(el('p', 'muted', 'Nothing logged in this period.'));
    }

    // Active bets that got no attention in this period
    if (reviewRange !== 'all') {
      const quiet = data.bets.filter(b => isActive(b) && !counts.has(b.id)
        && new Date(b.created || b.history[0].date) < r.to);
      if (quiet.length) {
        card.appendChild(el('p', 'untouched', 'No entries: ' + quiet.map(b => b.name).join(', ')));
      }
    }

    if (closedInRange.length) {
      card.appendChild(el('p', 'outcome-label', 'Closed'));
      closedInRange.forEach(b => {
        const p = el('p', 'bet-why', '');
        p.appendChild(el('strong', '', b.name));
        p.appendChild(el('span', 'pill ' + betStatus(b), betStatus(b) === 'done' ? 'Done' : 'Dropped'));
        if (b.outcome) p.appendChild(document.createTextNode(' — ' + b.outcome));
        card.appendChild(p);
      });
    }
    box.appendChild(card);
  }

  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function countWorkdays(daySet, monday) {
    let n = 0;
    for (let i = 0; i < 5; i++) if (daySet.has(addDays(monday, i).toDateString())) n++;
    return n;
  }

  // Plain-text summary of the selected range, for pasting into a chat with an LLM.
  function buildReviewText() {
    const r = rangeBounds(reviewRange);
    const entries = liveLog().filter(l => inRange(l.date, r)).sort((a, b) => new Date(a.date) - new Date(b.date));
    const L = [];
    L.push('# Big picture review — ' + r.label);
    L.push('');
    L.push('## Active bets');
    const active = data.bets.filter(isActive);
    if (!active.length) L.push('(none)');
    active.forEach(b => {
      const n = entries.filter(e => entryBetIds(e).includes(b.id)).length;
      const lt = lastTouch(b.id);
      L.push('- **' + b.name + '** — started ' + fmtDate(b.created || b.history[0].date) +
        '; ' + n + (n === 1 ? ' entry' : ' entries') + ' in period' + (lt ? '; last touched ' + fmtDate(lt) : '; never logged'));
      if (b.why) L.push('  Why: ' + b.why.replace(/\n+/g, ' '));
    });
    const closed = data.bets.filter(b => !isActive(b) && b.closed && inRange(b.closed, r));
    if (closed.length) {
      L.push('');
      L.push('## Closed in this period');
      closed.forEach(b => {
        L.push('- **' + b.name + '** — ' + betStatus(b) + ' ' + fmtDate(b.closed) +
          ', ran ' + weeksBetween(b.created || b.history[0].date, b.closed) + ' wk, ' + plural(entriesFor(b.id).length, 'entry', 'entries') + ' total');
        if (b.outcome) L.push('  Outcome: ' + b.outcome.replace(/\n+/g, ' '));
      });
    }
    L.push('');
    L.push('## Log (' + plural(entries.length, 'entry', 'entries') + ')');
    let lastDay = '';
    entries.forEach(e => {
      const day = fmtDay(e.date);
      if (day !== lastDay) { L.push(''); L.push('### ' + day); lastDay = day; }
      const bn = entryBets(e).map(b => b.name).join(' + ');
      const na = (e.attachments || []).length;
      L.push('- ' + (bn ? '[' + bn + '] ' : '') + (e.text || '').replace(/\n+/g, ' / ') + (na ? ' (' + plural(na, 'image', 'images') + ' attached)' : ''));
    });
    if (!entries.length) L.push('(none)');
    return L.join('\n');
  }

  document.getElementById('copy-review-btn').addEventListener('click', async () => {
    const text = buildReviewText();
    const flag = document.getElementById('copied-flag');
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // Clipboard API can be blocked (e.g. some in-app browsers) — fall back to a file.
      downloadFile('big-picture-review.md', text, 'text/markdown;charset=utf-8;');
      flag.textContent = 'Downloaded';
    }
    flag.style.display = 'inline';
    setTimeout(() => { flag.style.display = 'none'; flag.textContent = 'Copied'; }, 2000);
  });

  // ---------- log ----------
  function renderLog() {
    const fsel = document.getElementById('filter-bet');
    betOptions(fsel, { includeClosed: true, selected: filterBet, extra: [['all', 'All entries'], ['general', 'General notes']] });
    filterBet = fsel.value;

    const seg = document.getElementById('log-view');
    seg.innerHTML = '';
    [['calendar', 'Calendar'], ['list', 'List']].forEach(([k, label]) => {
      const b = el('button', logView === k ? 'on' : '', label);
      b.addEventListener('click', () => { logView = k; logLimit = LOG_PAGE; render(); });
      seg.appendChild(b);
    });

    const q = filterText.toLowerCase();
    const byBet = betFiltered();
    const filtered = byBet
      .filter(e => !q || (e.text || '').toLowerCase().includes(q))
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    renderHeatmap(byBet, q ? new Set(filtered.map(e => dayKey(e.date))) : null);
    renderDeleted();

    const logList = document.getElementById('log-list');
    logList.innerHTML = '';
    const more = document.getElementById('log-more');
    if (logView === 'calendar' && !q) {
      more.style.display = 'none';
      return;
    }
    if (q) {
      const h = el('p', 'small-muted', plural(filtered.length, 'note', 'notes') + ' matching "' + filterText.trim() + '"');
      h.style.margin = '12px 0 0';
      logList.appendChild(h);
    }
    if (!filtered.length) {
      logList.appendChild(el('p', 'muted', data.log.length ? 'No matching entries.' : 'No entries yet.'));
      logList.lastChild.style.marginTop = '12px';
    }

    const shown = filtered.slice(0, logLimit);
    // Count per week across the whole filtered set, so headers stay right when paging.
    const weekCounts = new Map();
    filtered.forEach(e => {
      const k = weekStart(e.date).getTime();
      weekCounts.set(k, (weekCounts.get(k) || 0) + 1);
    });
    let currentWeek = null;
    shown.forEach(entry => {
      const wk = weekStart(entry.date).getTime();
      if (wk !== currentWeek) {
        currentWeek = wk;
        const h = el('div', 'week-head');
        h.appendChild(el('span', '', weekLabel(new Date(wk))));
        const n = weekCounts.get(wk);
        h.appendChild(el('span', '', n + (n === 1 ? ' entry' : ' entries')));
        logList.appendChild(h);
      }
      logList.appendChild(renderLogEntry(entry));
    });

    more.style.display = filtered.length > logLimit ? 'block' : 'none';
    document.getElementById('log-more-btn').textContent = 'Show older (' + (filtered.length - logLimit) + ' more)';
  }

  function betFiltered() {
    return liveLog().filter(e => filterBet === 'all' || (filterBet === 'general' ? !entryBets(e).length : entryBetIds(e).includes(filterBet)));
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(d) { const x = new Date(d); return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate()); }
  function keyToDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function fmtTime(d) { return new Date(d).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }

  // GitHub-style grid: one column per week (Mon at top), one square per day,
  // shaded by how many notes that day has under the current bet filter.
  // `matchDays` (when searching) dims every day without a matching note.
  function renderHeatmap(entries, matchDays) {
    const box = document.getElementById('heatmap');
    const prevScroll = box.querySelector('.heat-scroll');
    const keepLeft = prevScroll ? prevScroll.scrollLeft : null;
    box.innerHTML = '';
    const counts = new Map();
    entries.forEach(e => { const k = dayKey(e.date); counts.set(k, (counts.get(k) || 0) + 1); });

    const today = new Date();
    const lastWeek = weekStart(today);
    let first = addDays(lastWeek, -7 * 25);                 // at least 26 weeks
    if (entries.length) {
      const earliest = weekStart(entries.reduce((a, b) => new Date(a.date) < new Date(b.date) ? a : b).date);
      if (earliest < first) first = earliest;
    }
    const nWeeks = Math.round((lastWeek - first) / (7 * 86400000)) + 1;
    const todayKey = dayKey(today);
    const level = n => n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4;

    const wrap = el('div', 'heat');
    const days = el('div', 'heat-days');
    ['', 'Mon', '', 'Wed', '', 'Fri', '', 'Sun'].forEach(t => days.appendChild(el('span', '', t)));
    wrap.appendChild(days);
    const scroll = el('div', 'heat-scroll');
    const inner = el('div', 'heat-inner');
    const months = el('div', 'heat-months');
    const grid = el('div', 'heat-grid');
    let lastMonth = -1;
    let lastLabelW = -99;
    for (let w = 0; w < nWeeks; w++) {
      const monday = addDays(first, 7 * w);
      // Label a month on the first week whose Monday falls in it.
      if (monday.getMonth() !== lastMonth) {
        lastMonth = monday.getMonth();
        if (w - lastLabelW >= 3) {
          lastLabelW = w;
          const m = el('span', '', monday.toLocaleDateString(undefined, { month: 'short' }));
          m.style.left = (w * 16) + 'px';
          months.appendChild(m);
        }
      }
      for (let d = 0; d < 7; d++) {
        const day = addDays(monday, d);
        const k = dayKey(day);
        const n = counts.get(k) || 0;
        const c = el('button', 'cell');
        c.type = 'button';
        if (day > today && k !== todayKey) { c.className = 'cell future'; c.disabled = true; grid.appendChild(c); continue; }
        if (n) c.classList.add('l' + level(n), 'has');
        if (k === todayKey) c.classList.add('today');
        if (k === openDay) c.classList.add('sel');
        if (matchDays && !matchDays.has(k)) c.classList.add('dim');
        c.title = fmtDay(day) + ' — ' + (n ? plural(n, 'note', 'notes') : 'no notes');
        c.setAttribute('aria-label', c.title);
        if (n) c.addEventListener('click', () => { openDay = k; render(); });
        grid.appendChild(c);
      }
    }
    inner.appendChild(months);
    inner.appendChild(grid);
    scroll.appendChild(inner);
    wrap.appendChild(scroll);
    box.appendChild(wrap);

    // Footer: count over the visible span + legend
    const foot = el('div', 'heat-foot');
    foot.appendChild(el('span', '', plural(entries.length, 'note', 'notes') + ' on ' + plural(counts.size, 'day', 'days')));
    const legend = el('span', 'legend');
    legend.appendChild(document.createTextNode('Less '));
    [0, 1, 2, 3, 4].forEach(l => legend.appendChild(el('span', 'cell' + (l ? ' l' + l : ''))));
    legend.appendChild(document.createTextNode(' More'));
    foot.appendChild(legend);
    box.appendChild(foot);

    // Start scrolled to the newest week; afterwards keep the user's position.
    requestAnimationFrame(() => {
      if (!heatScrolledToEnd || keepLeft === null) { scroll.scrollLeft = scroll.scrollWidth; heatScrolledToEnd = true; }
      else scroll.scrollLeft = keepLeft;
    });
  }

  // Day card: every note of one day, scrollable; ‹ › step to the previous/next day with notes.
  function renderDaySheet() {
    let back = document.getElementById('day-sheet');
    if (!openDay) { if (back) back.remove(); document.body.style.overflow = ''; return; }
    const entries = betFiltered().filter(e => dayKey(e.date) === openDay)
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    const daysWith = [...new Set(betFiltered().map(e => dayKey(e.date)))].sort();
    const idx = daysWith.indexOf(openDay);
    const prevDay = idx > 0 ? daysWith[idx - 1] : (idx === -1 ? daysWith.filter(k => k < openDay).pop() : null);
    const nextDay = idx >= 0 ? daysWith[idx + 1] : daysWith.find(k => k > openDay);

    let keepTop = 0;
    if (back) {
      const body = back.querySelector('.sheet-body');
      if (body && back.dataset.day === openDay) keepTop = body.scrollTop;
      back.remove();
    }
    back = el('div', 'sheet-back');
    back.id = 'day-sheet';
    back.dataset.day = openDay;
    back.addEventListener('click', (e) => { if (e.target === back) closeDay(); });
    const sheet = el('div', 'sheet');
    sheet.setAttribute('role', 'dialog');
    const head = el('div', 'sheet-head');
    const title = el('div', 'sheet-title');
    title.appendChild(el('strong', '', keyToDate(openDay).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })));
    title.appendChild(el('span', '', plural(entries.length, 'note', 'notes')));
    const prevBtn = el('button', 'icon-btn', '‹');
    prevBtn.title = 'Previous day with notes';
    prevBtn.disabled = !prevDay;
    prevBtn.addEventListener('click', () => { openDay = prevDay; editingLogId = null; render(); });
    const nextBtn = el('button', 'icon-btn', '›');
    nextBtn.title = 'Next day with notes';
    nextBtn.disabled = !nextDay;
    nextBtn.addEventListener('click', () => { openDay = nextDay; editingLogId = null; render(); });
    const closeBtn = el('button', 'icon-btn', '×');
    closeBtn.title = 'Close';
    closeBtn.addEventListener('click', closeDay);
    head.appendChild(title);
    head.appendChild(prevBtn);
    head.appendChild(nextBtn);
    head.appendChild(closeBtn);
    const body = el('div', 'sheet-body');
    if (!entries.length) body.appendChild(el('p', 'muted', 'No notes this day.'));
    entries.forEach(e => body.appendChild(renderLogEntry(e, { showTime: true })));
    sheet.appendChild(head);
    sheet.appendChild(body);
    back.appendChild(sheet);
    document.body.appendChild(back);
    document.body.style.overflow = 'hidden';
    body.scrollTop = keepTop;
  }
  function closeDay() { openDay = null; editingLogId = null; render(); }
  document.addEventListener('keydown', (e) => {
    if (!openDay || document.querySelector('.lightbox')) return;
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') closeDay();
    else if (e.key === 'ArrowLeft') document.querySelector('#day-sheet .icon-btn:nth-of-type(1)')?.click();
    else if (e.key === 'ArrowRight') document.querySelector('#day-sheet .icon-btn:nth-of-type(2)')?.click();
  });

  // ---------- delete / undo / restore ----------
  let toastTimer = null;
  function showToast(text, actionLabel, onAction) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    clearTimeout(toastTimer);
    const t = el('div', 'toast');
    t.appendChild(el('span', '', text));
    if (actionLabel) {
      const a = el('a', '', actionLabel);
      a.addEventListener('click', () => { t.remove(); onAction(); });
      t.appendChild(a);
    }
    document.body.appendChild(t);
    toastTimer = setTimeout(() => t.remove(), 7000);
  }
  async function deleteEntry(entry) {
    entry.deleted = new Date().toISOString();
    render();
    showToast('Note deleted', 'Undo', () => restoreEntry(entry));
    await save();
  }
  async function restoreEntry(entry) {
    delete entry.deleted;
    render();
    await save();
  }
  function renderDeleted() {
    const box = document.getElementById('deleted-box');
    box.innerHTML = '';
    const deleted = data.log.filter(e => e.deleted).sort((a, b) => new Date(b.deleted) - new Date(a.deleted));
    if (!deleted.length) return;
    const head = el('div', 'toggle-head');
    head.style.margin = '18px 0 8px';
    head.appendChild(el('span', 'small-muted', 'Deleted notes (' + deleted.length + ')'));
    head.appendChild(el('span', 'link-btn', showDeleted ? 'Hide' : 'Show'));
    head.addEventListener('click', () => { showDeleted = !showDeleted; render(); });
    box.appendChild(head);
    if (!showDeleted) return;
    deleted.forEach(e => {
      const w = el('div', 'log-entry');
      w.style.opacity = '0.75';
      w.appendChild(el('p', 'log-date', fmtDay(e.date) + ' · deleted ' + fmtDate(e.deleted)));
      if (e.text) appendExpandableText(w, 'del-' + e.id, e.text, LOG_LIMIT, 'log-text');
      if (e.attachments && e.attachments.length) {
        const row = el('div', 'att-row');
        e.attachments.forEach(a => row.appendChild(attThumb(a, {})));
        w.appendChild(row);
      }
      const actions = el('div', 'card-actions');
      actions.appendChild(linkBtn('Restore', () => restoreEntry(e)));
      w.appendChild(actions);
      box.appendChild(w);
    });
  }

  function renderLogEntry(entry, opts = {}) {
    ensureHistory(entry, ['text']);
    const bets = entryBets(entry);
    const wrapper = el('div', 'log-entry');

    if (editingLogId === entry.id) {
      const sel = new Set(bets.map(b => b.id));
      const chips = el('div', 'chips');
      renderBetChips(chips, sel);
      const comp = makeComposer({ text: entry.text || '', atts: entry.attachments || [] });
      const saveBtn = el('button', '', 'Save');
      const cancelBtn = el('button', '', 'Cancel');
      comp.bar.prepend(cancelBtn);
      comp.bar.prepend(saveBtn);
      wrapper.appendChild(chips);
      wrapper.appendChild(comp.root);

      saveBtn.addEventListener('click', async () => {
        const newText = comp.ta.value.trim();
        if (!newText && !comp.state.atts.length) return;
        if (comp.isBusy()) { alert('Still processing images — try again in a second.'); return; }
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        try {
          const attachments = await comp.commit();
          if (newText !== (entry.text || '')) {
            entry.history.push({ v: entry.history.length + 1, date: new Date().toISOString(), text: newText });
          }
          entry.text = newText;
          setEntryBets(entry, [...sel]);
          if (attachments.length) entry.attachments = attachments; else delete entry.attachments;
          editingLogId = null;
          render();
          await save();
        } catch (e) {
          console.error(e);
          alert('Saving images failed: ' + e.message);
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save';
        }
      });
      cancelBtn.addEventListener('click', () => { editingLogId = null; render(); });
      return wrapper;
    }

    const dateP = el('p', 'log-date', opts.showTime ? fmtTime(entry.date) : fmtDay(entry.date));
    bets.forEach((b, i) => {
      dateP.appendChild(document.createTextNode((i === 0 ? ' · ' : ' + ') + b.name));
      if (!isActive(b)) dateP.appendChild(el('span', 'pill ' + betStatus(b), betStatus(b) === 'done' ? 'Done' : 'Dropped'));
    });
    wrapper.appendChild(dateP);
    if (entry.text) appendExpandableText(wrapper, entry.id, entry.text, LOG_LIMIT, 'log-text');
    if (entry.attachments && entry.attachments.length) {
      const row = el('div', 'att-row');
      entry.attachments.forEach(a => row.appendChild(attThumb(a, {})));
      wrapper.appendChild(row);
    }

    bets.forEach(bet => {
      ensureHistory(bet, ['name', 'why']);
      const versionAtLog = betVersionAtDate(bet, entry.date);
      const currentVersion = bet.history.length;
      if (versionAtLog !== currentVersion) {
        const who = bets.length > 1 ? '"' + bet.name + '"' : 'Bet';
        wrapper.appendChild(el('span', 'stale-flag', who + ' has changed since this entry (was v' + versionAtLog + ', now v' + currentVersion + ')'));
        wrapper.appendChild(document.createTextNode(' '));
      }
    });

    const actions = el('div', 'card-actions');
    actions.appendChild(linkBtn('Edit', () => { editingLogId = entry.id; render(); }));
    if (entry.history.length > 1) {
      actions.appendChild(linkBtn(expandedLogHistory === entry.id ? 'Hide history' : 'History (v' + entry.history.length + ')', () => {
        expandedLogHistory = expandedLogHistory === entry.id ? null : entry.id;
        render();
      }));
    }
    // Soft delete: kept in the document (and the activity export); Undo toast + "Deleted notes" to restore.
    actions.appendChild(linkBtn('Delete', () => deleteEntry(entry), 'danger'));
    wrapper.appendChild(actions);

    if (expandedLogHistory === entry.id) {
      appendHistoryPanel(wrapper, entry.history, 'log-' + entry.id, (content, h) => {
        appendExpandableText(content, 'histv-log-' + entry.id + '-v' + h.v, h.text || '', LOG_LIMIT, 'log-text');
      });
    }
    return wrapper;
  }

  // ---------- images ----------
  // Pictures are downscaled in the browser and stored as JPEG data URLs in their
  // own Firestore docs (full + thumbnail), never in the main document.
  const FULL_MAX = 1600;
  const FULL_BUDGET = 700000;   // data-URL chars, well under the 1 MB doc limit
  const THUMB_MAX = 240;
  const thumbCache = new Map();
  const fullCache = new Map();
  const imgDoc = (kind, id) => doc(db, 'bigpicture', syncId + '__' + kind + '_' + id);

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('this image format isn\'t supported by the browser')); };
      img.src = url;
    });
  }
  function drawScaled(img, maxDim, quality) {
    const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';            // flatten transparent PNGs/screenshots
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return { data: c.toDataURL('image/jpeg', quality), w, h };
  }
  async function processImage(file) {
    const { img, url } = await loadImage(file);
    try {
      let dim = FULL_MAX, q = 0.82;
      let full = drawScaled(img, dim, q);
      while (full.data.length > FULL_BUDGET && dim > 500) {
        dim = Math.round(dim * 0.8);
        q = Math.max(0.6, q - 0.05);
        full = drawScaled(img, dim, q);
      }
      const thumb = drawScaled(img, THUMB_MAX, 0.7).data;
      const id = 'img_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      return { id, full: full.data, thumb, w: full.w, h: full.h, pending: true };
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  async function uploadAtt(a) {
    const created = new Date().toISOString();
    await setDoc(imgDoc('img', a.id), { data: a.full, w: a.w, h: a.h, created });
    await setDoc(imgDoc('thm', a.id), { data: a.thumb, created });
  }
  function cachedGet(cache, kind, id) {
    if (!cache.has(id)) {
      cache.set(id, getDoc(imgDoc(kind, id))
        .then(snap => snap.exists() ? snap.data().data : null)
        .catch(e => { console.error('image load failed', e); cache.delete(id); return null; }));
    }
    return cache.get(id);
  }
  const loadThumb = id => cachedGet(thumbCache, 'thm', id);
  const loadFull = id => cachedGet(fullCache, 'img', id);

  // A small clickable thumbnail. `att` is either a stored {id,w,h} or a pending
  // processed image (with .thumb/.full data URLs) not yet uploaded.
  function attThumb(att, { onRemove }) {
    const b = el('button', 'att');
    b.type = 'button';
    b.title = 'Open picture';
    const img = el('img');
    img.alt = '';
    if (att.pending) {
      img.src = att.thumb;
      b.appendChild(img);
    } else {
      const ph = el('span', 'ph', '…');
      b.appendChild(ph);
      loadThumb(att.id).then(src => {
        if (src) { img.src = src; ph.replaceWith(img); } else { ph.textContent = 'missing'; }
      });
    }
    b.addEventListener('click', () => {
      openLightbox(img.src || null, att.pending ? Promise.resolve(att.full) : loadFull(att.id));
    });
    if (onRemove) {
      const x = el('span', 'x', '×');
      x.title = 'Remove';
      x.addEventListener('click', (e) => { e.stopPropagation(); onRemove(); });
      b.appendChild(x);
    }
    return b;
  }

  function openLightbox(previewSrc, fullPromise) {
    const box = el('div', 'lightbox');
    const img = el('img');
    img.alt = '';
    if (previewSrc) img.src = previewSrc;
    box.appendChild(img);
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
    box.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(box);
    fullPromise.then(src => { if (src) img.src = src; });
  }

  // Text box + attachments: paste, drag-and-drop or the Attach button add pictures.
  function makeComposer({ text = '', atts = [], placeholder = '' }) {
    const root = el('div', 'composer');
    const ta = el('textarea');
    ta.value = text;
    ta.placeholder = placeholder;
    const row = el('div', 'att-row');
    const bar = el('div', 'compose-bar');
    const file = el('input');
    file.type = 'file';
    file.accept = 'image/*';
    file.multiple = true;
    file.style.display = 'none';
    const attachBtn = el('button', 'small', '📎 Attach');
    attachBtn.type = 'button';
    attachBtn.addEventListener('click', () => file.click());
    bar.appendChild(attachBtn);
    bar.appendChild(file);

    const state = { atts: [...atts], busy: 0 };
    function drawAtts() {
      row.innerHTML = '';
      state.atts.forEach(a => row.appendChild(attThumb(a, {
        onRemove: () => { state.atts = state.atts.filter(x => x !== a); drawAtts(); }
      })));
      for (let i = 0; i < state.busy; i++) {
        const ph = el('div', 'att');
        ph.appendChild(el('span', 'ph', 'Adding…'));
        row.appendChild(ph);
      }
      row.style.display = row.childNodes.length ? '' : 'none';
    }
    async function addFiles(files) {
      const imgs = [...files].filter(f => f && f.type && f.type.startsWith('image/'));
      if (!imgs.length) return;
      state.busy += imgs.length;
      drawAtts();
      for (const f of imgs) {
        try {
          state.atts.push(await processImage(f));
        } catch (e) {
          alert('Couldn\'t add ' + (f.name || 'picture') + ': ' + e.message);
        } finally {
          state.busy--;
          drawAtts();
        }
      }
    }

    ta.addEventListener('paste', (e) => {
      const items = [...((e.clipboardData && e.clipboardData.items) || [])];
      const files = items.filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
      if (!files.length) return;
      if (!e.clipboardData.getData('text/plain')) e.preventDefault();
      addFiles(files);
    });
    root.addEventListener('dragover', (e) => {
      if (![...e.dataTransfer.types].includes('Files')) return;
      e.preventDefault();
      root.classList.add('dragging');
    });
    root.addEventListener('dragleave', (e) => { if (!root.contains(e.relatedTarget)) root.classList.remove('dragging'); });
    root.addEventListener('drop', (e) => {
      if (!e.dataTransfer.files.length) return;
      e.preventDefault();
      e.stopPropagation();
      root.classList.remove('dragging');
      addFiles(e.dataTransfer.files);
    });
    file.addEventListener('change', () => { addFiles(file.files); file.value = ''; });

    root.appendChild(ta);
    root.appendChild(row);
    root.appendChild(bar);
    drawAtts();
    requestAnimationFrame(() => autosize(ta));

    return {
      root, ta, bar, state, addFiles,
      isBusy: () => state.busy > 0,
      // Uploads pending pictures; returns the attachment list to store on the entry.
      async commit() {
        for (const a of state.atts.filter(x => x.pending)) {
          await uploadAtt(a);
          thumbCache.set(a.id, Promise.resolve(a.thumb));
          fullCache.set(a.id, Promise.resolve(a.full));
          a.pending = false;
        }
        return state.atts.map(a => ({ id: a.id, w: a.w, h: a.h }));
      },
      reset() { ta.value = ''; state.atts = []; drawAtts(); autosize(ta); },
    };
  }

  function autosize(t) {
    if (!t.offsetParent) return;      // hidden; sized when shown
    t.style.height = 'auto';
    t.style.height = (t.scrollHeight + 2) + 'px';
  }
  document.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') autosize(e.target); });

  function scrollToLog() {
    document.getElementById('filter-bet').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('filter-bet').addEventListener('change', (e) => {
    filterBet = e.target.value;
    logLimit = LOG_PAGE;
    render();
  });
  document.getElementById('filter-text').addEventListener('input', (e) => {
    filterText = e.target.value;
    logLimit = LOG_PAGE;
    renderLog();
  });
  document.getElementById('log-more-btn').addEventListener('click', () => {
    logLimit += LOG_PAGE * 2;
    renderLog();
  });

  // ---------- add bet / add entry ----------
  document.getElementById('add-bet-btn').addEventListener('click', () => {
    document.getElementById('add-bet-form').style.display = 'block';
    document.getElementById('bet-name').focus();
  });
  document.getElementById('cancel-bet-btn').addEventListener('click', () => {
    document.getElementById('add-bet-form').style.display = 'none';
    document.getElementById('bet-name').value = '';
    document.getElementById('bet-why').value = '';
  });
  document.getElementById('save-bet-btn').addEventListener('click', async () => {
    const name = document.getElementById('bet-name').value.trim();
    const why = document.getElementById('bet-why').value.trim();
    if (!name) return;
    const created = new Date().toISOString();
    data.bets.push({ id: 'bet_' + Date.now(), name, why, created, status: 'active', history: [{ v: 1, date: created, name, why }] });
    document.getElementById('bet-name').value = '';
    document.getElementById('bet-why').value = '';
    document.getElementById('add-bet-form').style.display = 'none';
    render();
    await save();
  });

  const logComposer = makeComposer({ placeholder: 'What did you actually spend attention on today? (Paste or drop pictures here)' });
  logComposer.ta.id = 'log-text';
  const addEntryBtn = el('button', '', 'Add entry');
  addEntryBtn.id = 'save-log-btn';
  logComposer.bar.prepend(addEntryBtn);
  document.getElementById('log-composer').appendChild(logComposer.root);

  addEntryBtn.addEventListener('click', async () => {
    const text = logComposer.ta.value.trim();
    if (!text && !logComposer.state.atts.length) return;
    if (logComposer.isBusy()) { alert('Still processing images — try again in a second.'); return; }
    addEntryBtn.disabled = true;
    addEntryBtn.textContent = 'Saving…';
    try {
      const attachments = await logComposer.commit();
      const date = new Date().toISOString();
      const entry = { id: 'log_' + Date.now(), text, date, history: [{ v: 1, date, text }] };
      setEntryBets(entry, [...composeBets]);
      if (attachments.length) entry.attachments = attachments;
      data.log.push(entry);
      logComposer.reset();
      render();
      await save();
    } catch (e) {
      console.error(e);
      alert('Saving images failed: ' + e.message);
    } finally {
      addEntryBtn.disabled = false;
      addEntryBtn.textContent = 'Add entry';
    }
  });

  // A picture dropped anywhere else on the page goes to the "Log today" box
  // instead of the browser navigating away to the image.
  window.addEventListener('dragover', (e) => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault();
    if (appEl.style.display !== 'none') logComposer.addFiles(e.dataTransfer.files);
  });

  // ---------- version tag ----------
  function showVersion(dateStr) {
    document.getElementById('version').textContent = 'v' + APP_VERSION + ' · updated ' + fmtDate(dateStr);
  }
  showVersion(APP_UPDATED + 'T12:00:00');
  fetch('https://api.github.com/repos/allitob/big_picture/commits?path=index.html&per_page=1')
    .then(r => r.ok ? r.json() : null)
    .then(j => { const d = j && j[0] && j[0].commit && j[0].commit.committer.date; if (d) showVersion(d); })
    .catch(() => {});

  // ---------- export ----------
  function csvEscape(v) {
    const s = (v === null || v === undefined) ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function toCsv(rows, headers) {
    const lines = [headers.join(',')];
    rows.forEach(r => lines.push(headers.map(h => csvEscape(r[h])).join(',')));
    return lines.join('\r\n');
  }

  function downloadFile(filename, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Every version of every bet and log entry, plus status changes and deletions,
  // chronological — a full activity trail. New columns are appended at the end.
  function buildActivityRows() {
    const rows = [];
    data.bets.forEach(bet => {
      ensureHistory(bet, ['name', 'why']);
      bet.history.forEach(h => {
        rows.push({
          date: h.date, type: 'bet', action: h.v === 1 ? 'created' : 'edited',
          item_id: bet.id, version: h.v, bet_name: '', name: h.name, why: h.why || '', text: '', status: '', outcome: ''
        });
      });
      (bet.statusLog || []).forEach(s => {
        rows.push({
          date: s.date, type: 'bet', action: s.status === 'active' ? 'reopened' : 'closed',
          item_id: bet.id, version: '', bet_name: '', name: bet.name, why: '', text: '', status: s.status, outcome: s.outcome || ''
        });
      });
    });
    data.log.forEach(entry => {
      ensureHistory(entry, ['text']);
      const betNames = entryBets(entry).map(b => b.name).join(' + ');
      entry.history.forEach(h => {
        rows.push({
          date: h.date, type: 'log', action: h.v === 1 ? 'created' : 'edited',
          item_id: entry.id, version: h.v, bet_name: betNames, name: '', why: '', text: h.text, status: '', outcome: ''
        });
      });
      if (entry.deleted) {
        rows.push({
          date: entry.deleted, type: 'log', action: 'deleted',
          item_id: entry.id, version: '', bet_name: betNames, name: '', why: '', text: entry.text, status: '', outcome: ''
        });
      }
    });
    rows.sort((a, b) => new Date(a.date) - new Date(b.date));
    return rows;
  }

  // Every bet and log entry grouped with all of its own versions.
  function buildVersionsRows() {
    const rows = [];
    data.bets.forEach(bet => {
      ensureHistory(bet, ['name', 'why']);
      const currentV = bet.history.length;
      bet.history.forEach(h => {
        rows.push({
          item_type: 'bet', item_id: bet.id, version: h.v, is_current: h.v === currentV ? 'yes' : 'no',
          date: h.date, name: h.name, why: h.why || '', text: '', bet_id: '', bet_name: '',
          status: betStatus(bet), closed: bet.closed || '', outcome: bet.outcome || '', deleted: '', attachments: ''
        });
      });
    });
    data.log.forEach(entry => {
      ensureHistory(entry, ['text']);
      const betNames = entryBets(entry).map(b => b.name).join(' + ');
      const nAtt = (entry.attachments || []).length;
      const currentV = entry.history.length;
      entry.history.forEach(h => {
        rows.push({
          item_type: 'log', item_id: entry.id, version: h.v, is_current: h.v === currentV ? 'yes' : 'no',
          date: h.date, name: '', why: '', text: h.text, bet_id: entryBetIds(entry).join(';'), bet_name: betNames,
          status: '', closed: '', outcome: '', deleted: entry.deleted || '', attachments: nAtt
        });
      });
    });
    rows.sort((a, b) => {
      if (a.item_type !== b.item_type) return a.item_type.localeCompare(b.item_type);
      if (a.item_id !== b.item_id) return a.item_id.localeCompare(b.item_id);
      return a.version - b.version;
    });
    return rows;
  }

  document.getElementById('export-activity-btn').addEventListener('click', () => {
    const headers = ['date', 'type', 'action', 'item_id', 'version', 'bet_name', 'name', 'why', 'text', 'status', 'outcome'];
    downloadFile('big-picture-activity.csv', toCsv(buildActivityRows(), headers), 'text/csv;charset=utf-8;');
  });

  document.getElementById('export-versions-btn').addEventListener('click', () => {
    const headers = ['item_type', 'item_id', 'version', 'is_current', 'date', 'name', 'why', 'text', 'bet_id', 'bet_name', 'status', 'closed', 'outcome', 'deleted', 'attachments'];
    downloadFile('big-picture-versions.csv', toCsv(buildVersionsRows(), headers), 'text/csv;charset=utf-8;');
  });
</script>
</body>
</html>
